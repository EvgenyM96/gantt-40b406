    const item = document.createElement("li");
    item.appendChild(el("span", "gone", "✓ " + row.key));
    item.appendChild(el("span", "since", row.group));
    list.appendChild(item);
  });
  diff.added.forEach(function(row){
    const item = document.createElement("li");
    item.appendChild(el("span", "came", "+ " + row.key));
    item.appendChild(el("span", "since", row.group));
    list.appendChild(item);
  });
  box.appendChild(list);
  document.getElementById("problems").appendChild(box);
}

function renderProblems(){
  const box = document.getElementById("problems");
  const groups = (DATA.problems || []).slice();
  renderDiff();

  const overdue = overdueGroup();
  if (overdue) groups.unshift(overdue);

  const urgentIds = { "no-dates-urgent": true, "broken-dates": true, "overdue": true };
  let total = 0;

  if (!groups.length){
    box.appendChild(el("div", "prob-clean", "Проблем не найдено — структура и даты в порядке."));
    return 0;
  }

  groups.forEach(function(group){
    total += group.keys.length;
    const section = el("div", "prob" + (urgentIds[group.id] ? " prob--urgent" : ""));

    const head = el("h2", null, group.title);
    head.appendChild(el("span", "count", String(group.keys.length)));
    section.appendChild(head);
    section.appendChild(el("p", "hint", group.hint));

    const list = document.createElement("ul");
    group.keys.forEach(function(key){
      const node = NODES[key];
      const item = document.createElement("li");

      const link = el("a", "key", key);
      link.href = "https://tracker.yandex.ru/" + key;
      link.target = "_blank";
      link.rel = "noopener";
      item.appendChild(link);
      item.appendChild(el("span", "name", node.summary));

      const side = [node.type, node.status];
      if (node.priority && node.priority !== "Средний") side.push(node.priority);
      if (node.bar) side.push(dayToText(node.bar.from) + " → " + dayToText(node.bar.to));
      item.appendChild(el("span", "side", side.join(" · ")));

      list.appendChild(item);
    });
    section.appendChild(list);
    box.appendChild(section);
  });

  return total;
}

/* ── Дропдаун ───────────────────────────────────────── */

/**
 * Переиспользуемый выпадающий список. Возвращает { el, value, set }.
 * Нативный <select> не даёт ни счётчиков в строках, ни своего вида,
 * поэтому здесь свой — но на нативных <button> с ролями listbox/option,
 * чтобы клавиатура и скринридер работали без дописывания.
 *
 * @param {{items: Array, value: string, placeholder: string, onChange: Function}} config
 */
function createDropdown(config){
  /* multiple: значение — массив ключей, пункт с пустым value работает как
     сброс, меню после клика остаётся открытым (иначе отметить второй эпик
     стоит лишнего открытия). */
  const multiple = !!config.multiple;
  const wrap = el("div", "dd" + (multiple ? " is-multi" : ""));
  const btn = el("button", "dd-btn");
  btn.type = "button";
  btn.setAttribute("aria-haspopup", "listbox");
  btn.setAttribute("aria-expanded", "false");

  const label = el("span", "dd-label", config.placeholder);
  btn.appendChild(label);
  btn.appendChild(el("span", "dd-caret", "▼"));

  const menu = el("div", "dd-menu");
  menu.setAttribute("role", "listbox");
  if (multiple) menu.setAttribute("aria-multiselectable", "true");
  menu.hidden = true;

  let value = multiple ? (config.value || []).slice() : (config.value || "");

  function close(){
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
  function open(){
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    const active = menu.querySelector('[aria-selected="true"]') || menu.firstElementChild;
    if (active) active.focus();
  }

  function labelOf(key){
    const item = config.items.find(function(i){ return i.value === key; });
    return item && item.value ? item.label : config.placeholder;
  }

  /** Один выбранный показываем целиком: имя эпика информативнее счётчика.
   *  От двух — только счёт, полные имена в кнопку не помещаются. */
  function captionFor(next){
    if (!multiple) return labelOf(next);
    if (!next.length) return config.placeholder;
    if (next.length === 1) return labelOf(next[0]);
    return config.summary ? config.summary(next.length) : "Выбрано: " + next.length;
  }

  function isChosen(optValue, next){
    if (!multiple) return optValue === next;
    return optValue ? next.indexOf(optValue) !== -1 : next.length === 0;
  }

  function set(next, silent){
    value = multiple ? next.slice() : next;
    label.textContent = captionFor(value);
    btn.classList.toggle("is-set", multiple ? value.length > 0 : !!value);
    menu.querySelectorAll(".dd-opt").forEach(function(opt){
      opt.setAttribute("aria-selected", String(isChosen(opt.dataset.value, value)));
    });
    if (!silent && config.onChange) config.onChange(value);
  }

  config.items.forEach(function(item){
    const opt = el("button", "dd-opt");
    opt.type = "button";
    opt.setAttribute("role", "option");
    opt.setAttribute("aria-selected", String(isChosen(item.value, value)));
    opt.dataset.value = item.value;
    opt.appendChild(el("span", null, item.label));
    if (item.count != null) opt.appendChild(el("span", "dd-count", String(item.count)));
    opt.addEventListener("click", function(){
      if (!multiple){
        set(item.value);
        close();
        btn.focus();
        return;
      }
      if (!item.value){ set([]); return; }
      const without = value.filter(function(v){ return v !== item.value; });
      const next = without.length === value.length ? value.concat([item.value]) : without;
      set(next);
    });
    menu.appendChild(opt);
  });

  btn.addEventListener("click", function(){
    if (menu.hidden) open(); else close();
  });

  wrap.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !menu.hidden){ close(); btn.focus(); return; }
    if (menu.hidden) return;
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const options = [...menu.querySelectorAll(".dd-opt")];
    const index = options.indexOf(document.activeElement);
    const next = e.key === "ArrowDown" ? index + 1 : index - 1;
    if (options[next]) options[next].focus();
  });

  document.addEventListener("click", function(e){
    if (!wrap.contains(e.target)) close();
  });

  wrap.appendChild(btn);
  wrap.appendChild(menu);
  set(value, true);

  return { el: wrap, get value(){ return value; }, set: set };
}

/* ── Вид «Дерево» ───────────────────────────────────── */
const TREE = DATA.tree;
const TTL = TREE ? TREE.timeline : { from: 0, to: 1 };
let whoDropdown = null;

function buildTreeNode(key, level){
  const node = TREE.nodes[key];
  const wrap = el("div", "tnode");
  wrap.dataset.key = key;
  wrap.dataset.search = searchText(node);
  // Ветка считается завершённой, только если внутри не осталось живых задач.
  if (node.closed && !node.openInside) wrap.classList.add("all-closed");

  wrap.style.setProperty("--lvl", level);

  const row = el("div", "trow");
  row.style.setProperty("--lvl", level);
  if (node.closed) row.classList.add("closed");
  if (node.type === "Epic") row.classList.add("is-epic");
  if (node.type === "Story") row.classList.add("is-story");
  if (node.type === STAGE_TYPE) row.classList.add("is-stage");

  if (node.children.length){
    const btn = el("button", "ttw");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "t-" + key);
    btn.setAttribute("aria-label", "Развернуть " + key);
    row.appendChild(btn);
  } else {
    row.appendChild(el("span", "ttw-gap"));
  }

  row.appendChild(el("span", "tdot g-" + node.group));

  const link = el("a", "key", key);
  link.href = "https://tracker.yandex.ru/" + key;
  link.target = "_blank";
  link.rel = "noopener";
  row.appendChild(link);

  row.appendChild(el("span", "ttype", node.type));
  // Дисциплина отдельным бейджем: без неё непонятно, почему строка нашлась
  // по запросу «дизайн» — в названии стоит «[Design]», а поле, по которому
  // совпало, на экране до этого не показывалось вовсе.
  if (node.discipline){
    const disc = el("span", "tdisc", node.discipline);
    disc.dataset.stage = node.discipline;
    row.appendChild(disc);
  }
  row.appendChild(el("span", "tname", node.summary));

  if (node.openInside){
    const badge = el("span", "tinside", "живых внутри: " + node.openInside);
    row.appendChild(badge);
  }
  // Даты здесь текстом, а не полосой: увидеть срок полезно, рисовать
  // второй таймлайн рядом с Гантом — нет.
  if (node.bar) row.appendChild(el("span", "tdates", node.start + " → " + node.deadline));
  else if (node.point) row.appendChild(el("span", "tdates",
    (node.point.kind === "deadline" ? "до " : "с ") +
    (node.point.kind === "deadline" ? node.deadline : node.start)));

  row.appendChild(el("span", "tstatus", node.status));
  row.appendChild(el("span", "tass", node.assignee));

  wrap.appendChild(row);

  if (node.children.length){
    const kids = el("div", "tkids");
    kids.id = "t-" + key;
    kids.hidden = true;
    kids.style.setProperty("--lvl", level);
    node.children.forEach(function(child){ kids.appendChild(buildTreeNode(child, level + 1)); });
    wrap.appendChild(kids);
  }
  return wrap;
}

function renderTree(){
  const box = document.getElementById("tree");
  if (!TREE){
    box.appendChild(el("div", "tree-note", "Дерево недоступно: пересобери страницу с доступом к Трекеру."));
    return;
  }

  const body = el("div", "tree-body");
  box.appendChild(body);

  TREE.roots.forEach(function(key){ body.appendChild(buildTreeNode(key, 0)); });

  if (TREE.homeless.length){
    const btn = el("button", "tsection", "Вне эпиков — " + TREE.homeless.length);
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "t-homeless");
    const kids = el("div", "tkids");
    kids.id = "t-homeless";
    kids.hidden = true;
    TREE.homeless.forEach(function(key){ kids.appendChild(buildTreeNode(key, 0)); });
    body.appendChild(btn);
    body.appendChild(kids);
  }

  // Счётчик живых задач у каждого — сразу видно, у кого сейчас работа.
  const live = {};
  Object.values(TREE.nodes).forEach(function(n){
    if (!n.assignee) return;
    if (!n.closed) live[n.assignee] = (live[n.assignee] || 0) + 1;
    else if (live[n.assignee] == null) live[n.assignee] = 0;
  });

  const items = [{ value: "", label: "Все исполнители" }].concat(
    Object.keys(live).sort(function(a, b){ return live[b] - live[a] || a.localeCompare(b); })
      .map(function(name){ return { value: name, label: name, count: live[name] }; })
  );

  whoDropdown = createDropdown({
    items: items,
    value: "",
    placeholder: "Все исполнители",
    onChange: applyTreeFilter,
  });
  document.getElementById("who-slot").appendChild(whoDropdown.el);

  document.body.classList.add("tree-hide-done");
}

/** Фильтр дерева: человек и поиск действуют вместе, пересечением.
 *
 *  Оба критерия держат одну и ту же разметку — `on-path` на предках и
 *  `tree-filtered` на body, — поэтому считаются одним проходом. Двумя
 *  независимыми функциями второй стирал бы результат первого: выбрал
 *  человека, набрал текст — и человек молча сбрасывался.
 *
 *  Предков показываем всегда: без них лист висит в воздухе и непонятно,
 *  к какому эпику относится. */
function applyTreeFilter(){
  const box = document.getElementById("tree");
  const name = whoDropdown ? whoDropdown.value : "";
  const query = searchQuery();
  const hideDone = document.getElementById("tree-done").checked;

  box.querySelectorAll(".tnode").forEach(function(n){ n.classList.remove("on-path", "match"); });
  clearMarks(box);
  document.body.classList.toggle("tree-filtered", !!name || !!query);
  if (!name && !query) return;

  box.querySelectorAll(".tnode").forEach(function(wrap){
    const node = TREE.nodes[wrap.dataset.key];
    if (!node) return;
    if (name && node.assignee !== name) return;
    if (query && wrap.dataset.search.indexOf(query) === -1) return;
    // Закрытую задачу при включённом скрытии не тянем: иначе её предки
    // останутся в списке с кнопкой раскрытия, за которой пусто.
    if (hideDone && node.closed && !node.openInside) return;
    // Совпадение помечаем отдельно от пути: `on-path` получают и предки,
    // и сам узел — по нему видимость, но не по нему яркость.
    wrap.classList.add("match");
    if (query) highlightRow(wrap.querySelector(".trow"), query);
    let current = wrap;
    while (current && current !== box){
      if (current.classList && current.classList.contains("tnode")) current.classList.add("on-path");
      if (current.classList && current.classList.contains("tkids")){
        current.hidden = false;
        const owner = document.querySelector('[aria-controls="' + current.id + '"]');
        if (owner) owner.setAttribute("aria-expanded", "true");
      }
      current = current.parentElement;
    }
  });
}

document.getElementById("tree").addEventListener("click", function(e){
  const btn = e.target.closest(".ttw, .tsection");
  if (!btn) return;
  const box = document.getElementById(btn.getAttribute("aria-controls"));
  if (!box) return;
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  box.hidden = open;
});

document.getElementById("tree-done").addEventListener("change", function(e){
  document.body.classList.toggle("tree-hide-done", e.target.checked);
  // Состав пути зависит от того, скрыты ли завершённые, — пересчитываем.
  applyTreeFilter();
});
document.getElementById("tree-expand").addEventListener("click", function(){
  const buttons = document.querySelectorAll("#tree .ttw, #tree .tsection");
  const anyClosed = [...buttons].some(function(b){ return b.getAttribute("aria-expanded") === "false"; });
  buttons.forEach(function(b){
    b.setAttribute("aria-expanded", String(anyClosed));
    const box = document.getElementById(b.getAttribute("aria-controls"));
    if (box) box.hidden = !anyClosed;
  });
  this.textContent = anyClosed ? "Свернуть всё" : "Развернуть всё";
});

/** Фильтр по эпикам — один на оба вида: в Ганте прячет чужие группы,
 *  в дереве оставляет выбранные ветки целиком. Принимает список ключей;
 *  пустой список снимает фильтр. */
function filterByEpic(keys){
  const chosen = Array.isArray(keys) ? keys : (keys ? [keys] : []);
  document.body.classList.toggle("epic-filtered", chosen.length > 0);
  document.querySelectorAll("#gantt .grp, #tree .tree-body > .tnode").forEach(function(n){
    n.classList.toggle("epic-on", chosen.indexOf(n.dataset.key) !== -1);
  });
  chosen.forEach(expandEpic);
}

/** Разворачиваем выбранное: фильтр на свёрнутой ветке показал бы одну строку. */
function expandEpic(key){
  const group = document.querySelector('#gantt .grp[data-key="' + key + '"]');
  if (group){
    const btn = group.querySelector(".twisty");
    const kids = btn && document.getElementById(btn.getAttribute("aria-controls"));
    if (btn && kids){ btn.setAttribute("aria-expanded", "true"); kids.hidden = false; }
  }
  // В дереве раскрываем ветку целиком: смысл фильтра — увидеть весь состав
  // эпика, а не его первый уровень.
  const node = document.querySelector('#tree .tree-body > .tnode[data-key="' + key + '"]');
  if (node){
    node.querySelectorAll(".ttw").forEach(function(btn){
      btn.setAttribute("aria-expanded", "true");
      const kids = document.getElementById(btn.getAttribute("aria-controls"));
      if (kids) kids.hidden = false;
    });
  }
}

/* ── Вид «Спринты» ─────────────────────────────────────── */
/* Снапшот из data/sprints.json — метрики закрытых спринтов, посчитанные
 * build.py один раз при --close-sprint. Страница их не пересчитывает:
 * Трекер переписывает историю, и живой пересчёт закрытого спринта задним
 * числом даёт ложную картину (см. README и комментарий в build.py). */

/** Цвет полосы отдела — те же токены, что красят дисциплину на Ганте
 *  и в Дереве (`.row[data-stage]`, DISCIPLINES в build.py). Свой набор
 *  цветов здесь означал бы, что «Бэкенд» синий на одной вкладке и другого
 *  цвета на соседней — то же расхождение каналов, которого по всему
 *  инструменту старательно избегали. */
const SPR_DEPT_COLOR = {
  "Бэкенд": "var(--c-back)",
  "Фронтенд": "var(--c-front)",
  "Аналитика": "var(--c-analysis)",
  "Дизайн": "var(--c-design)",
};
function sprDeptColor(name){ return SPR_DEPT_COLOR[name] || "var(--c-new)"; }

/** Русское склонение по числу — единственное место, где вкладке «Спринты»
 *  это нужно (подпись бара «N задач»). */
function sprPlural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if ([2, 3, 4].indexOf(mod10) !== -1 && [12, 13, 14].indexOf(mod100) === -1) return few;
  return many;
}

function sprDate(iso){
  return iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4) : "?";
}

/** Дата без года — подпись под столбиком велосити-чарта. Год там тот же,
 *  что в таблице истории строкой ниже, а места в слоте съедает половину. */
function sprDateShort(iso){
  return iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) : "?";
}

/** Обрезка подписи под ширину слота. SVG-текст не переносится и не
 *  обрезается сам: длинная подпись просто наезжает на соседнюю, и это
 *  единственный способ поймать её до рендера. Бюджет символов считается
 *  от средней ширины глифа — точнее без измерения текста на живой странице
 *  не выйдет, а для коротких id спринтов приблизительного хватает. */
function sprFitLabel(text, width, glyph){
  const budget = Math.max(3, Math.floor(width / glyph));
  return text.length > budget ? text.slice(0, budget - 1) + "…" : text;
}

/** Одна строка бар-чарта: подпись слева, полоса, значение справа.
 *  Общая разметка для всех четырёх бар-чартов карточки — они отличаются
 *  только источником данных и цветом заливки.
 *
 *  Полоса собирается из span'ов, а не из div'ов, потому что у одного
 *  потребителя (строка исполнителя живого спринта) она лежит внутри
 *  <summary>, а тот по спецификации принимает только phrasing content —
 *  div там был бы невалиден. Визуально это ничего не меняет: строка и
 *  дорожка всё равно flex-контейнеры, а flex блокирует свои элементы сам.
 *  Второй вариант разметки заводить незачем — ни один чарт не опирается на
 *  то, что элементы именно блочные. */
function sprBarRow(name, value, valueLabel, max, color){
  const row = el("span", "spr-bar-row");
  row.appendChild(el("span", "spr-bar-name", name));
  const track = el("span", "spr-bar-track");
  const fill = el("span", "spr-bar-fill");
  /* Минимум в 2% нужен, чтобы маленькое, но ненулевое значение оставалось
     видимым. К самому нулю он не применяется: «нет данных» и «почти ноль» —
     разные утверждения, и рисовать под первым полоску значит показывать
     то, чего нет. */
  fill.style.width = (value > 0 && max > 0 ? Math.max(2, (value / max) * 100) : 0) + "%";
  fill.style.background = color;
  track.appendChild(fill);
  row.appendChild(track);
  row.appendChild(el("span", "spr-bar-val", valueLabel));
  return row;
}

/** Закрытые спринты снапшота — общая выборка для средней велосити и для
 *  велосити-чарта истории. Даты в условии не придирка: без start/end длину
 *  спринта не посчитать, а значит и приводить велосити не к чему. */
function closedSprints(){
  return SPRINTS.filter(function(s){ return s.status === "closed" && s.start && s.end; });
}

/** Велосити одного спринта, приведённая к 14 дням.
 *
 *  `end` в данных — последний день спринта ВКЛЮЧИТЕЛЬНО, поэтому длина это
 *  разница дат плюс один, а не сама разница. Проверяется на самих данных:
 *  S06 10.08–23.08 даёт ровно 14 дней, живой S7 24.08–06.09 — те же 14 и
 *  10 рабочих дней в burn-down, а у S05 13 дней сходятся с его пометкой
 *  «спринт разово сокращён на 1 день». Без `+ 1` каждый спринт считался бы
 *  на день короче, и нормировка завышала бы велосити в 14/13 раза.
 *
 *  Отдельной функцией — потому что считающих мест стало два: средняя
 *  (avgVelocity) и высота столбика в чарте. Формула, списанная во второе
 *  место копипастой, разъезжается с первым при первой же правке — ровно
 *  так инклюзивная длина здесь уже уезжала и чинилась отдельным раундом. */
function sprNormVelocity(s){
  /* Math.max(1, …) держит знаменатель положительным: перепутанные местами
     start/end дали бы ноль или отрицательную длину. */
  const days = Math.max(1,
    Math.round((Date.parse(s.end) - Date.parse(s.start)) / 864e5) + 1);
  return s.velocity_sp * 14 / days;
}

/** Средняя велосити закрытых спринтов, приведённая к 14 дням, — знаменатель
 *  focus factor. Живой спринт в среднюю не входит: он ещё не закончился.
 *
 *  Приведение к 14 дням не формальность: S05 длился 13 дней, и сырое
 *  среднее по velocity_sp занизило бы норму двухнедельного спринта.
 *  Сама нормировка — sprNormVelocity. */
function avgVelocity(){
  const closed = closedSprints();
  if (!closed.length) return 0;
  const norm = closed.map(sprNormVelocity);
  return Math.round(norm.reduce(function(a, b){ return a + b; }, 0) / norm.length);
}

/** Строка калькулятора capacity: подпись, ползунок, текущее значение.
 *  Возвращает узлы, а не готовый DOM: пересчёт меняет текст на месте, и
 *  вызывающему нужны ссылки на сам input и на ячейку значения.
 *  Дефолт приводится к диапазону — он берётся из живых данных и может из
 *  диапазона выпасть (спринт целиком на выходных дал бы 0 рабочих дней).
 *  `step` необязателен и по умолчанию равен 1: шаг крупнее нужен там, где
 *  точность в единицу врала бы о природе вводной. */
function sprCalcRow(name, min, max, value, unit, step){
  const row = el("label", "spr-bar-row spr-calc-row");
  row.appendChild(el("span", "spr-bar-name", name));
  const input = document.createElement("input");
  input.type = "range";
  input.className = "spr-calc-range";
  /* min/max/step выставляются до value: у range значение вне ещё не заданных
     границ браузер молча зажимает по дефолтным 0–100, а не попавшее на сетку
     шага — округляет к ближайшему её узлу. */
  input.min = min;
  input.max = max;
  input.step = step || 1;
  input.value = Math.min(max, Math.max(min, value));
  row.appendChild(input);
  const out = el("span", "spr-bar-val spr-calc-val");
  row.appendChild(out);
  return {
    row: row,
    input: input,
    out: out,
    unit: unit,
    read: function(){ return Number(input.value); },
  };
}

/* ── Блок «Текущий спринт» ──────────────────────────────── */
/* Единственный блок вкладки на живом расчёте: всё посчитано в build.py
 * (compute_live_sprint), страница только рисует. Burn-down — по числу
 * задач, а не по SP: SP заполнены не у всех задач, а закрытие задачи —
 * факт без пробелов. Насколько дырявы SP, показывает «Качество данных». */
const LIVE = DATA.liveSprint || null;

/** Имя корзины без исполнителя — ровно то, что кладёт в список build.py.
 *  Вынесено в константу, потому что сравнений с ним на странице стало два:
 *  цвет полосы в бар-чарте и размер команды в калькуляторе capacity. */
const SPR_UNASSIGNED = "Не назначен";

/** «Не назначен» в списке исполнителей — не человек, а дыра в данных, и
 *  полоса обязана это показывать. Плоским токеном не выходит: единственный
 *  приглушённый цвет палитры (--text-dim) в обеих темах почти совпадает с
 *  --c-new, которым залиты полосы людей, — «дыра» стала бы неотличима от
 *  исполнителя. Поэтому штриховка тем же токеном, каким burn-down рисует
 *  плановую линию: пунктир на этой вкладке уже значит «не факт, а условность».
 *  Просветы показывают фон дорожки, так что полоса тускнеет вместе с темой. */
const SPR_UNASSIGNED_FILL =
  "repeating-linear-gradient(90deg,var(--text-dim) 0 5px,transparent 5px 9px)";

/** Ссылка на ту же выборку в самом Трекере: раскрывашка ниже показывает
 *  задачи только для чтения, а переназначить, переоценить и увидеть поля,
 *  которых на странице нет, можно лишь там.
 *
 *  База запроса приходит готовой из build.py (`trackerQuery`) — теми же
 *  очередью и типами листьев, какими отобраны сами задачи. Литералов
 *  «Queue: MCA» и списка типов здесь нет намеренно: продублируй их — и
 *  ссылка начнёт открывать не то, что показывает полоса рядом с ней.
 *  Страница дописывает только исполнителя, он у каждой строки свой.
 *
 *  Имя поля в запросе русское — «Исполнитель». В MCA часть полей по
 *  английскому имени не ищется вовсе (те же грабли уже ловились на «Дата
 *  начала» и «Родительский тикет»), русское имя работает всегда.
 *
 *  Корзина без исполнителя переводится в empty(), а не в своё название:
 *  «Не назначен» — наша подпись дыре в данных, в Трекере такого человека
 *  нет, и `Исполнитель: "Не назначен"` вернул бы пустую выдачу.
 *
 *  Параметр адреса — `_q`, единственная документированная форма
 *  (`https://tracker.yandex.ru/issues/?_q=<запрос>`). Похожий на правду
 *  `q` Трекер молча игнорирует и открывает прошлый фильтр пользователя:
 *  страница выглядит рабочей, а показывает чужую выборку.
 *
 *  Запрос целиком проходит через encodeURIComponent: в нём есть кавычки,
 *  пробелы и имя спринта с «·» — без кодирования ссылка ломается на первом
 *  же спецсимволе.
 *
 *  Числа полосы и выдача по ссылке могут разойтись: полоса посчитана на
 *  снапшоте прошлой сборки, Трекер по ссылке отвечает живьём. Это свойство
 *  статичной страницы, а не ошибка запроса — расхождение ровно на те
 *  изменения, что случились после сборки. */
function sprAssigneeQueryUrl(name){
  const who = name === SPR_UNASSIGNED
    ? "Исполнитель: empty()"
    : "Исполнитель: \"" + name + "\"";
  return "https://tracker.yandex.ru/issues/?_q="
    + encodeURIComponent(LIVE.trackerQuery + " AND " + who);
}

/* ── Cycle time ─────────────────────────────────────────── */
/* Цикл каждой задачи считает build.py (`compute_cycle_time`): от ПЕРВОГО
 * входа в «В работе» до ПОСЛЕДНЕГО входа в «Готово»/«Закрыт», в рабочих
 * днях. Ожидание в «Ревью» и «Можно тестировать» входит внутрь намеренно:
 * для заказчика задача всё это время не сделана, а стоит она чаще всего
 * именно там.
 *
 * Агрегаты (медиана, p85, топ-5 по статусу) считает страница, и это
 * осознанное отступление от «считает build.py, страница рисует»: фильтр
 * отделов интерактивный, а готовить на сборке все срезы N отделов × M
 * статусов незачем. Формулы продублированы из build.py — cycleMedian и
 * cyclePct обязаны отвечать ровно то же, что cycle_median и
 * cycle_percentile там; правишь одну сторону, правь обе.
 *
 * Свода «средний цикл по человеку» здесь нет и не будет: команда решила
 * индивидуальные метрики производительности не считать. Цикл конкретной
 * задачи в раскрывашке исполнителя виден — это факт про задачу, а не
 * рейтинг человека. */
const CYCLE = (LIVE && LIVE.cycle) || null;

/** Имя чипа «без фильтра». Отдельной константой, потому что сравнений с
 *  ним три: подсветка кнопки, отбор задач и подпись под плитками. */
const CYCLE_ALL = "все";

/** Цвет статуса в стеке «где висела задача» и в легенде. Токены заведены
 *  псевдонимами палитры страницы (см. --st-* в :root), поэтому тёмная
 *  тема работает без второй карты цветов. Неизвестный статус — серый
 *  --st-other: возврат в «Беклог» после отката тоже копит время, и он
 *  обязан быть виден, пусть и без собственного смысла в цвете. */
const CYCLE_STATUS_COLOR = {
  "В работе": "var(--st-work)",
  "На доработку": "var(--st-rework)",
  "Ревью": "var(--st-review)",
  "Можно тестировать": "var(--st-cantest)",
  "Тестируется": "var(--st-testing)",
};
function cycleStatusColor(name){ return CYCLE_STATUS_COLOR[name] || "var(--st-other)"; }

/** Число дней в человеческом виде: одна десятичная и русский разделитель.
 *
 *  Ноль показывается как «<0,1», если величина всё же положительна:
 *  округлённый «0» читался бы как «задача в этом статусе не была», а это
 *  другое утверждение — отсутствие статуса даёт прочерк, не ноль. */
function cycleFmt(v){
  if (v == null) return "—";
  if (v > 0 && v < 0.05) return "<0,1";
  /* Десятичная всегда одна, даже у целого: в колонке чисел «1 дн» рядом с
     «1,3 дн» читается как другая точность измерения, а она одна и та же. */
  return v.toLocaleString("ru-RU", {minimumFractionDigits: 1, maximumFractionDigits: 1});
}

/** Порог малой выборки приходит из build.py (`cycle.minSample`), а не
 *  задан здесь числом: второе число в JS разъехалось бы с первым при
 *  первой же правке, и терминал с экраном стали бы называть «малой
 *  выборкой» разное. Запасное значение — на случай payload без поля
 *  (страница переживает старую сборку, а не падает на ней). */
const CYCLE_MIN_SAMPLE = (LIVE && LIVE.cycle && LIVE.cycle.minSample) || 5;

/** Медиана, а не среднее: одна задача, пролежавшая месяц в «Можно
 *  тестировать», сдвигает среднее так, что оно перестаёт описывать
 *  типичную задачу. Хвост показывает p85 рядом. */
function cycleMedian(values){
  if (!values.length) return null;
  const s = values.slice().sort(function(a, b){ return a - b; });
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/** Перцентиль методом «ближайший ранг». Доля задаётся целым процентом:
 *  `0.85 * 20` в двоичной арифметике даёт 17.000000000000002, и
 *  округление вверх ушло бы на элемент дальше, чем в build.py. */
function cyclePct(values, percent){
  if (!values.length) return null;
  const s = values.slice().sort(function(a, b){ return a - b; });
  const rank = Math.ceil(percent * s.length / 100);
  return s[Math.min(s.length - 1, Math.max(1, rank) - 1)];
}

/** Плоский список задач спринта с приклеенными измерениями цикла.
 *
 *  Ключ, название, статус и «закрыта ли» лежат в LIVE.assignees — их
 *  рисует раскрывашка исполнителя; измерения — в LIVE.cycle.tasks.
 *  Второй копии названий в payload нет намеренно: одна строка в двух
 *  местах JSON — это и лишние килобайты, и гарантированное расхождение
 *  при первой правке. Склейка делается здесь, один раз при загрузке.
 *
 *  Задача без записи в cycle.tasks в принципе возможна только если
 *  расчёта нет вовсе (спринт есть, а истории не завезли): build.py кладёт
 *  туда все листья, в том числе те, чью историю не удалось получить. */
const CYCLE_ROWS = (LIVE ? (LIVE.assignees || []) : []).reduce(function(acc, a){
  (a.tasks || []).forEach(function(t){
    const m = (CYCLE && CYCLE.tasks[t.key]) || null;
    acc.push({
      key: t.key, summary: t.summary, status: t.status, closed: t.closed,
      assignee: a.name,
      dept: m ? m.dept : "Без отдела",
      cycle: m ? m.cycle : null,
      running: m ? m.running : null,
      byStatus: (m && m.byStatus) || {},
    });
  });
  return acc;
}, []);

/** Тот же список ключом — раскрывашке исполнителя нужен доступ по ключу
 *  задачи, а не перебор всего спринта на каждую строку. */
const CYCLE_ROW_BY_KEY = CYCLE_ROWS.reduce(function(acc, r){
  acc[r.key] = r;
  return acc;
}, {});

/* Выбранный отдел. Живёт на уровне модуля, а не внутри renderLiveSprint:
   его читают и стек в строке задачи, и полосы «Где висит», и плитки. */
let cycleDept = CYCLE_ALL;

function cycleInDept(row){ return cycleDept === CYCLE_ALL || row.dept === cycleDept; }

/** Задачи выбранного отдела. */
function cycleSubset(){ return CYCLE_ROWS.filter(cycleInDept); }

/** Популяция цикла: закрытые задачи, у которых он измерен. Закрытая минуя
 *  «В работе» сюда не попадает — у неё нет левого края измерения, и это
 *  не ноль, а «мерить нечего» (видно в «Качестве данных»). */
function cycleMeasured(){
  return cycleSubset().filter(function(r){ return r.closed && r.cycle != null; });
}

/** Стек «где висела задача»: доли времени по статусам одной полосой.
 *
 *  Сегменты — <span>, не кнопки: строка задачи уже содержит ссылку на
 *  карточку, и второй интерактив внутри неё стал бы лишним таб-стопом.
 *  Подсказку даёт общий #tip по mousemove самого контейнера — один
 *  обработчик на полосу вместо обработчика на каждый сегмент.
 *
 *  Для скринридера полоса скрыта: она пересказывает картинкой то, что
 *  рядом стоит числом (цикл) и разобрано по статусам в секции «Где
 *  висит». Озвучивать десяток безымянных сегментов смысла нет. */
function cycleStackNode(row){
  const stack = el("span", "spr-asg-stack");
  stack.setAttribute("aria-hidden", "true");

  const names = Object.keys(row.byStatus);
  let total = 0;
  names.forEach(function(n){ total += row.byStatus[n]; });
  if (!total) return stack;

  /* Порядок сегментов — порядок движения задачи (CYCLE.stages), хвостом
     статусы вне цикла: так полоса читается слева направо как маршрут, а
     не как случайная россыпь. */
  const known = (CYCLE ? CYCLE.stages : []).filter(function(s){ return row.byStatus[s]; });
  const rest = names.filter(function(s){ return known.indexOf(s) === -1; });
  known.concat(rest).forEach(function(name){
    const seg = el("span");
    seg.style.width = (row.byStatus[name] / total * 100) + "%";
    seg.style.background = cycleStatusColor(name);
    seg.dataset.status = name;
    seg.dataset.value = cycleFmt(row.byStatus[name]);
    stack.appendChild(seg);
  });

  stack.addEventListener("mousemove", function(e){
    const seg = e.target.closest("span[data-status]");
    if (!seg){ tip.style.display = "none"; return; }
    tip.textContent = "";
    tip.appendChild(el("b", null, seg.dataset.status + ": " + seg.dataset.value + " дн"));
    placeTip(seg, e.clientX, e.clientY);
  });
  stack.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  return stack;
}

/** Число справа в строке задачи: итоговый цикл, идущий цикл или прочерк.
 *
 *  Три состояния различаются намеренно. «1,3 дн» — измерено. «идёт 2,4 дн»
 *  — задача ещё не закрыта, цифра будет расти, и в медиану она не входит.
 *  «—» — измерить нечего, и подсказка объясняет почему: молча показать тут
 *  ноль значило бы соврать, что задача прошла путь мгновенно. */
function cycleValueNode(row){
  const cell = el("span", "spr-asg-cycle");
  if (row.cycle != null){
    cell.textContent = cycleFmt(row.cycle) + " дн";
  } else if (row.running != null){
    cell.textContent = "идёт " + cycleFmt(row.running) + " дн";
    cell.classList.add("running");
  } else {
    cell.textContent = "—";
    cell.title = "цикл не измерен: задача не заходила в «В работе» "
      + "или её история статусов не загрузилась";
  }
  return cell;
}

/** Строка «По исполнителям» — раскрывашка: свёрнутая это прежняя полоса
 *  загрузки, развёрнутая показывает сами задачи спринта этого человека.
 *  Полоса отвечает на «сколько», а на приёмке спрашивают «что именно» —
 *  и без списка ответ приходилось собирать фильтром в Трекере руками.
 *
 *  <details> вместо кнопки со своим состоянием: раскрытие — ровно та
 *  семантика, которую элемент несёт нативно, вместе с клавиатурой и
 *  объявлением «свёрнуто/развёрнуто». Свой aria-expanded ему не нужен.
 *  Полоса лежит внутри <summary> (то есть внутри кнопки), а ссылки — в
 *  теле, снаружи: вложенного интерактива не возникает. */
function sprAssigneeRow(a, maxTotal){
  const box = el("details", "spr-asg");

  const head = document.createElement("summary");
  /* Карет — тот же знак и тот же поворот, что у твисти дерева: раскрытие
     на этой странице уже выглядит так, второй язык жестов заводить незачем.
     Смысла он не несёт (состояние объявляет сам <details>) — aria-hidden. */
  const caret = el("span", "spr-asg-caret", "▶");
  caret.setAttribute("aria-hidden", "true");
  head.appendChild(caret);
  head.appendChild(sprBarRow(a.name, a.total, a.closed + " / " + a.total, maxTotal,
    a.name === SPR_UNASSIGNED ? SPR_UNASSIGNED_FILL : "var(--c-new)"));
  box.appendChild(head);

  const body = el("div", "spr-asg-body");
  /* Ссылка ведёт на ВЕСЬ спринт этого человека, а список рядом может быть
     сужен фильтром отдела: компонент в MCA составной («Бэкенд · API»), и
     дописать его в запрос точным сравнением нельзя. Поэтому под фильтром
     подпись честно говорит, что откроется больше, чем показано, — вместо
     ссылки, молча ведущей не туда, куда обещает соседний список. */
  const filter = el("a", "spr-asg-filter", cycleDept === CYCLE_ALL
    ? "открыть в Трекере"
    : "открыть в Трекере — весь спринт этого человека, без фильтра отдела");
  filter.href = sprAssigneeQueryUrl(a.name);
  filter.target = "_blank";
  filter.rel = "noopener";
  body.appendChild(filter);

  const list = document.createElement("ul");
  list.className = "spr-asg-list";
  /* Порядок задач приходит из build.py (открытые сверху, внутри по номеру)
     и здесь не пересортировывается: одна сортировка — одно место. */
  (a.tasks || []).forEach(function(t){
    const item = document.createElement("li");
    if (t.closed) item.className = "done";
    const link = el("a", "key", t.key);
    link.href = "https://tracker.yandex.ru/" + t.key;
    link.target = "_blank";
    link.rel = "noopener";
    item.appendChild(link);
    item.appendChild(el("span", "spr-asg-name", t.summary));
    item.appendChild(el("span", "spr-asg-status", t.status));
    /* Стек «где висела» и цикл — справа от статуса: строка отвечает на
       «что за задача», а затем на «сколько она шла и где стояла».
       Строка рисуется и без расчёта цикла (истории может не быть вовсе) —
       тогда обе ячейки честно пустые, а не отсутствующие: колонки не
       должны прыгать от задачи к задаче. */
    const row = CYCLE_ROW_BY_KEY[t.key];
    if (row){
      item.appendChild(cycleStackNode(row));
      item.appendChild(cycleValueNode(row));
    }
    list.appendChild(item);
  });
  body.appendChild(list);
  box.appendChild(body);
  return box;
}

/** Сверка расчёта страницы со сборкой.
 *
 *  Медиана и p85 живут в двух реализациях — Python в build.py и JS здесь, —
 *  и это единственное место во всём инструменте, где одна величина считается
 *  дважды. Компромисс осознанный (интерактивный фильтр), но за него надо
 *  платить проверкой: без неё расхождение формул проявилось бы как «цифра
 *  в терминале не сходится с цифрой на экране» — и не через минуту, а через
 *  месяц, когда кто-нибудь заметит.
 *
 *  Основная проверка — на ЭТАЛОННЫХ наборах (`cycle.selfTest`), а не на
 *  живых данных: живые сегодня случайно совпадут при обеих формулах
 *  округления ранга, а завтра разойдутся — то есть проверка окажется
 *  бесполезной ровно в тот день, когда она нужна. Наборы подобраны в
 *  build.py так, чтобы поймать нечётную и чётную длину, выборку ниже
 *  порога и неотсортированный вход.
 *
 *  Сверка живого среза «все» с `overall` остаётся сверх того: она стоит
 *  один проход по массиву и ловит расхождения не в формулах, а в том, что
 *  страница собрала не ту популяцию. Достаточно одного вызова на загрузке:
 *  смена отдела формул не меняет, а build.py считает только срез «все».
 *
 *  Плашка адресована нам, а не PM, и всё же она видимая: спрятать несход
 *  в консоль значит согласиться, что его никто не увидит.
 *
 *  :returns: текст расхождения или null
 */
function cycleSelfCheck(){
  if (!CYCLE) return null;
  const off = [];
  function compare(name, mine, theirs){
    if (mine == null && theirs == null) return;
    if (mine == null || theirs == null || Math.abs(mine - theirs) > 1e-6){
      off.push(name + " " + (mine == null ? "—" : mine) + " vs "
        + (theirs == null ? "—" : theirs));
    }
  }

  (CYCLE.selfTest || []).forEach(function(probe){
    const label = "[" + probe.values.join(",") + "]";
    compare(label + " медиана", cycleMedian(probe.values), probe.median);
    compare(label + " p85", cyclePct(probe.values, 85), probe.p85);
  });

  if (CYCLE.overall){
    const cycles = CYCLE_ROWS
      .filter(function(r){ return r.closed && r.cycle != null; })
      .map(function(r){ return r.cycle; });
    compare("живой срез n", cycles.length, CYCLE.overall.n);
    compare("живой срез медиана", cycleMedian(cycles), CYCLE.overall.median);
    compare("живой срез p85", cyclePct(cycles, 85), CYCLE.overall.p85);
  }
  return off.length ? "расчёт страницы разошёлся со сборкой: " + off.join(" · ") : null;
}

/** Чипы фильтра по отделу. Управляют плитками цикла, полосами «Где висит»
 *  и списками задач в раскрывашках исполнителей; берндаун, capacity и
 *  «Качество данных» они не трогают — те описывают весь спринт целиком,
 *  и срез по отделу означал бы там другую метрику, а не другой взгляд.
 *
 *  <button aria-pressed> в контейнере .seg — тот же орган, которым в
 *  шапке переключаются виды. Свой aria-pressed обязателен: у обычной
 *  кнопки состояния «нажата» нет, и без атрибута выбор существовал бы
 *  только как заливка.
 *
 *  :param onPick: колбэк перерисовки; вызывается после смены отдела
 */
function cycleFilterNode(onPick){
  const box = el("div", "spr-filters");
  box.appendChild(el("span", "spr-filters-label", "Отдел"));

  const seg = el("div", "seg");
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", "Фильтр по отделу");

  /* Порядок отделов приходит из build.py (`cycle.depts`) — он же
     фиксирован набором дисциплин очереди. Страница его не пересобирает:
     чипы, переставляющиеся от сборки к сборке, ломают мышечную память. */
  const names = [CYCLE_ALL].concat(CYCLE.depts || []);
  const buttons = names.map(function(name){
    const btn = document.createElement("button");
    btn.type = "button";
    const count = name === CYCLE_ALL
      ? CYCLE_ROWS.length
      : CYCLE_ROWS.filter(function(r){ return r.dept === name; }).length;
    btn.textContent = name + " · " + count;
    btn.setAttribute("aria-pressed", String(name === cycleDept));
    btn.addEventListener("click", function(){
      cycleDept = name;
      buttons.forEach(function(other, i){
        other.setAttribute("aria-pressed", String(names[i] === cycleDept));
      });
      onPick();
    });
    seg.appendChild(btn);
    return btn;
  });

  box.appendChild(seg);
  return box;
}

/** Сводка по одному статусу для полос «Где висит»: медиана, p85, сколько
 *  задач через него прошло и пятёрка самых долгих.
 *
 *  Сортировка по длительности живёт здесь и только здесь: порядок задач в
 *  раскрывашках исполнителей приходит из build.py и не пересортировывается,
 *  а «пять самых долгих» — другой вопрос к тем же данным, и ответ на него
 *  зависит от выбранного отдела, то есть на сборке его не приготовить. */
function cycleStageStats(stage, measured){
  const hits = measured
    .filter(function(r){ return r.byStatus[stage] != null; })
    .map(function(r){ return { row: r, v: r.byStatus[stage] }; })
    .sort(function(a, b){ return b.v - a.v; });
  const values = hits.map(function(h){ return h.v; });
  return {
    stage: stage,
    n: hits.length,
    median: cycleMedian(values),
    p85: cyclePct(values, 85),
    top: hits.slice(0, 5),
  };
}

/** Подсказка по полосе статуса. Тот же #tip, что у Ганта и берндауна:
 *  узел лежит на уровне body, вкладкой не скрывается, своё здесь только
 *  содержимое. Второй тултип на странице заводить не за чем. */
function cycleStageTip(target, stats, x, y){
  tip.textContent = "";
  tip.appendChild(el("b", null, stats.stage));

  const dl = document.createElement("dl");
  function add(term, value){
    dl.appendChild(el("dt", null, term));
    dl.appendChild(el("dd", null, value));
  }
  add("Медиана", stats.n ? cycleFmt(stats.median) + " дн" : "нет данных");
  /* p85 на выборке меньше CYCLE_MIN_SAMPLE — это максимум, а не хвост.
     Показать его числом значит выдать одну задачу за закономерность. */
  add("p85", stats.n >= CYCLE_MIN_SAMPLE
    ? cycleFmt(stats.p85) + " дн"
    : "— · мало данных");
  add("Задач прошло", String(stats.n));
  if (stats.top[0]){
    add("Дольше всех", stats.top[0].row.key + " — " + cycleFmt(stats.top[0].v) + " дн");
  }
  tip.appendChild(dl);
  tip.appendChild(el("div", "tip-hint", "клик — пять самых долгих задач"));

  placeTip(target, x, y);
}

/** Одна полоса «Где висит» — раскрывашка на <details>, как строка
 *  исполнителя: свёрнутая это полоса с медианой, развёрнутая — пятёрка
 *  самых долгих задач со ссылками на карточки.
 *
 *  :param stats: результат cycleStageStats
 *  :param max: медиана самого долгого статуса — знаменатель длины полосы
 *  :param isMax: этот статус и есть самый долгий (красится тревожным)
 */
function cycleStageRow(stats, max, isMax){
  const box = el("details", "spr-stage");

  const head = document.createElement("summary");
  const caret = el("span", "spr-stage-caret", "▶");
  caret.setAttribute("aria-hidden", "true");
  head.appendChild(caret);
  /* Статус, через который никто не проходил, — это «нет данных», а не
     «ноль дней»: полоса нулевой длины с подписью «— дн» читалась бы как
     мгновенно проходимый этап. Поэтому подпись говорит прямо. */
  const label = stats.n
    ? cycleFmt(stats.median) + " дн · " + stats.n + " "
      + sprPlural(stats.n, "задача", "задачи", "задач")
    : "нет данных · 0 задач";
  head.appendChild(sprBarRow(stats.stage, stats.n ? (stats.median || 0) : 0, label, max,
    isMax ? "var(--c-urgent)" : "var(--c-new)"));
  /* Подсказка висит на <summary>, а не на всей строке: тело раскрывашки
     содержит ссылки, и всплывающая над ними панель мешала бы по ним
     кликать. */
  head.addEventListener("mousemove", function(e){
    cycleStageTip(head, stats, e.clientX, e.clientY);
  });
  head.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  /* То же и с клавиатуры: <summary> получает фокус табом, и без этой пары
     медиана с p85 существовали бы только для мыши. placeTip без координат
     сам якорится к элементу — ровно так же подсказку открывает фокус на
     Ганте. */
  head.addEventListener("focus", function(){ cycleStageTip(head, stats, null, null); });
  head.addEventListener("blur", function(){ tip.style.display = "none"; });
  box.appendChild(head);

  const body = el("div", "spr-stage-body");
  const list = document.createElement("ul");
  list.className = "spr-asg-list";
  if (!stats.top.length){
    const empty = document.createElement("li");
    empty.appendChild(el("span", "spr-asg-name",
      "ни одна закрытая задача этого среза не заходила в статус"));
    list.appendChild(empty);
  }
  stats.top.forEach(function(hit){
    const item = document.createElement("li");
    const link = el("a", "key", hit.row.key);
    link.href = "https://tracker.yandex.ru/" + hit.row.key;
    link.target = "_blank";
    link.rel = "noopener";
    item.appendChild(link);
    item.appendChild(el("span", "spr-asg-name", hit.row.summary));
    item.appendChild(el("span", "spr-asg-cycle", cycleFmt(hit.v) + " дн"));
    list.appendChild(item);
  });
  body.appendChild(list);
  box.appendChild(body);
  return box;
}

/** Заполняет контейнер полосами «Где висит» по выбранному отделу.
 *
 *  Самый долгий статус красится --c-urgent — это и есть ответ секции на
 *  вопрос «где стоит работа». Остальные нейтральные --c-new: раскрась их
 *  по смыслу статуса, и глаз перестал бы находить главную полосу. */
function cycleFillStages(box){
  box.textContent = "";
  const measured = cycleMeasured();
  const rows = (CYCLE.stages || []).map(function(stage){
    return cycleStageStats(stage, measured);
  });
  /* concat([0]) держит знаменатель определённым на пустом срезе:
     Math.max.apply от пустого массива вернул бы -Infinity. Нижняя
     граница 0.1 — чтобы единственная ненулевая полоса не растянулась
     на весь трек при медиане в сотые доли дня. */
  const max = Math.max.apply(null,
    rows.map(function(r){ return r.median || 0; }).concat([0.1]));
  const longest = rows.reduce(function(best, r){
    return (r.median || 0) > (best && best.median || 0) ? r : best;
  }, null);
  /* На малой выборке лидер случаен: одна невезучая задача делает «самым
     долгим» любой статус. Красить его тревожным цветом значит указывать
     команде на проблему, которой в данных нет. */
  const trustworthy = measured.length >= CYCLE_MIN_SAMPLE;

  rows.forEach(function(r){
    box.appendChild(cycleStageRow(r, max, trustworthy && r === longest && !!r.median));
  });
  if (!measured.length){
    box.appendChild(el("p", "spr-empty",
      "в этом срезе нет закрытых задач с измеренным циклом — делить нечего"));
  } else if (!trustworthy){
    box.appendChild(el("p", "spr-empty",
      "мало данных для сравнения (n < " + CYCLE_MIN_SAMPLE + "): "
      + "самый долгий статус не выделен, p85 не показан"));
  }
}

/** SVG-узлы нельзя создавать через createElement: вне SVG-namespace
 *  браузер отдаёт HTMLUnknownElement, который молча не рисуется. */
function svgEl(name, attrs){
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

/** Карточка идущего спринта: KPI-плитки и burn-down. Возвращает null,
 *  когда спринт не идёт, — вкладка тогда выглядит ровно как раньше. */
function renderLiveSprint(){
  if (!LIVE) return null;

  const card = el("div", "spr-live");
  card.appendChild(el("h2", null,
    "Текущий спринт · " + LIVE.name + " · " + sprDate(LIVE.start) + " – " + sprDate(LIVE.end)));

  const k = LIVE.kpi;
  const kpis = el("div", "spr-kpis");
  /* Возвращает обе ячейки плитки: у плиток цикла меняется и число, и
     подпись (под фильтром отдела она называет отдел), а перестроение DOM
     на каждый клик по чипу дёргало бы весь ряд. */
  function kpiTile(value, caption){
    const tile = el("div", "spr-kpi-tile");
    const num = el("span", "n", value);
    const cap = el("span", "k", caption);
    tile.appendChild(num);
    tile.appendChild(cap);
    kpis.appendChild(tile);
    return { n: num, k: cap };
  }

  kpiTile(String(k.total), "задач в спринте");
  kpiTile(String(k.closed), "закрыто");

  /* Плитки цикла стоят сразу после «закрыто», а не в конце ряда: они про
     ту же популяцию — закрытые задачи, — и читаются как продолжение
     вопроса «сколько сделали» ответом «и как быстро».
     Числа проставит cycleRedraw ниже: они зависят от выбранного отдела,
     и второй точки, где они считаются, быть не должно. */
  /* Гейт — errorFatal, а не сам факт ошибки. Частичный отказ (не доехала
     история части задач) гасил бы иначе весь блок целиком: тридцать
     посчитанных задач исчезали бы из-за пяти недоступных. Плитки гаснут
     только когда считать действительно не из чего — этот случай называет
     сам build.py, по данным, а не по факту сбоя сети. */
  /* Три разных «нечего показать», и путать их нельзя:
     — закрытых задач в спринте ещё нет (первые дни): нормальное состояние
       «данных пока нет», не ошибка;
     — история не доехала ни по одной закрытой задаче: отказ, errorFatal;
     — история не доехала по части задач: считаем по остальным (не сюда). */
  const cycleEmpty = !!(CYCLE && !CYCLE.errorFatal && !CYCLE.quality.closed);
  const cycleReady = !!(CYCLE && !CYCLE.errorFatal && CYCLE.quality.closed);
  let cycleMedianTile = null, cyclePctTile = null, cycleNote = null;
  if (cycleReady){
    cycleMedianTile = kpiTile("", "cycle time · медиана");
    cyclePctTile = kpiTile("", "cycle time · p85");
  } else if (CYCLE){
    /* Считать не из чего — на месте обеих плиток стоит причина. Пустой ряд
       читался бы как «метрику не завезли», а прочерки — как «померили и
       вышло ничего»; ни то, ни другое не правда. Причина отказа красная,
       «закрытых пока нет» — обычной подписью: это не поломка. */
    const tile = el("div", "spr-kpi-tile spr-kpi-tile--wide");
    const text = el("span", "k", cycleEmpty
      ? "cycle time · закрытых задач пока нет"
      : CYCLE.error);
    if (!cycleEmpty) text.classList.add("spr-cycle-warn");
    tile.appendChild(text);
    kpis.appendChild(tile);
  }

  kpiTile(k.commitmentSp + " sp", "взято");
  kpiTile(k.velocitySp + " sp", "закрыто, sp");
  kpiTile(String(k.workdaysLeft), "раб. дней осталось");
  card.appendChild(kpis);

  if (cycleReady){
    cycleNote = el("p", "spr-kpis-note");
    card.appendChild(cycleNote);
    /* Частичный отказ отдельной строкой, а не растворённый в подписи:
       «посчитано по 30 задачам» и «ещё по пяти истории нет» — разные
       факты, и второй объясняет, почему первое число меньше ожидаемого. */
    if (CYCLE.error){
      card.appendChild(el("p", "spr-kpis-note spr-cycle-warn", CYCLE.error));
    }
    const drift = cycleSelfCheck();
    if (drift) card.appendChild(el("p", "spr-kpis-note spr-cycle-warn", drift));
  }

  card.appendChild(renderBurndown());

  /* Фильтр отделов и «Где висит» — между берндауном и людьми: сначала
     «успеваем ли», потом «где стоит работа», и только потом «у кого».
     Фильтр стоит над обоими блоками, которыми он управляет, — так видно,
     что он относится к ним, а не к берндауну выше. */
  let stageBars = null, stageTitle = null;
  if (cycleReady){
    card.appendChild(cycleFilterNode(function(){ cycleRedraw(); }));

    const stages = el("div", "spr-section");
    stageTitle = el("h3", null, "Где висит");
    stages.appendChild(stageTitle);
    const legend = el("div", "legend spr-stage-legend");
    [["var(--c-new)", "медиана времени в статусе, рабочие дни"],
     ["var(--c-urgent)", "самый долгий статус"]].forEach(function(pair){
      const item = document.createElement("span");
      const swatch = el("span", "swatch");
      swatch.style.background = pair[0];
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(pair[1]));
      legend.appendChild(item);
    });
    legend.appendChild(el("span", null, "наведи на полосу, кликни для списка задач"));
    stages.appendChild(legend);

    stageBars = el("div", "spr-bars");
    stages.appendChild(stageBars);
    /* Пять этапов — не весь список статусов, через которые задача проходит.
       Возврат в «Будем делать» или «Беклог» время тоже копит, и оно входит
       в цикл; полос у таких статусов нет (они не этапы движения), но в
       стеках раскрывашек они видны серым. Без этой строки сумма полос не
       сходилась бы с циклом, и объяснения этому на странице не нашлось. */
    stages.appendChild(el("p", "spr-calc-note",
      "статусы вне пяти этапов (например, возврат в «Будем делать») в цикл "
      + "входят и видны серым в стеках «где висела» у исполнителей"));
    card.appendChild(stages);
  }

  /* Секции живого блока размечены тем же .spr-section, что и секции карточек
     закрытых спринтов: стиль заголовку даёт селектор `.spr-section h3`, у
     .spr-live своих правил для h3 нет — голый h3 приехал бы дефолтом браузера.
     Заодно это тот же ритм отступов, что в карточках ниже по вкладке. */
  const byAssignee = el("div", "spr-section");
  byAssignee.appendChild(el("h3", null, "По исполнителям"));
  const assigneeBars = el("div", "spr-bars");
  byAssignee.appendChild(assigneeBars);
  card.appendChild(byAssignee);

  /** Перерисовка всего, чем управляет фильтр отделов: плитки цикла,
   *  подпись под ними, полосы «Где висит» и списки задач по людям.
   *
   *  Полосы людей пересобираются целиком, а не прячут чужие строки
   *  классом: иначе счётчик «3 / 7» на полосе продолжал бы считать
   *  задачи скрытых отделов и врал бы про показанный список.
   *  Побочный эффект честного пересчёта — раскрывашки схлопываются;
   *  фокус при этом остаётся на нажатом чипе, он вне перерисовываемой
   *  области. */
  function cycleRedraw(){
    /* Подпись отдела уезжает в сами плитки, а не только в строку под ними:
       вырезанный из страницы или распечатанный ряд KPI иначе утверждал бы
       «медиана 2,4 дн» про весь спринт, хотя показан один отдел. */
    const deptTail = cycleDept === CYCLE_ALL ? "" : " · " + cycleDept;
    if (cycleMedianTile){
      const cycles = cycleMeasured().map(function(r){ return r.cycle; });
      const enough = cycles.length >= CYCLE_MIN_SAMPLE;
      cycleMedianTile.n.textContent = cycleFmt(cycleMedian(cycles)) + " дн";
      cycleMedianTile.k.textContent = "cycle time · медиана" + deptTail;
      /* p85 на выборке меньше CYCLE_MIN_SAMPLE — это максимум под чужим
         именем. Прочерк честнее числа, за которым стоит одна задача. */
      cyclePctTile.n.textContent = enough ? cycleFmt(cyclePct(cycles, 85)) + " дн" : "—";
      cyclePctTile.k.textContent = "cycle time · p85" + deptTail
        + (enough ? "" : " · мало данных");
      cycleNote.textContent = "цикл посчитан по " + cycles.length + " "
        + sprPlural(cycles.length,
            "закрытой задаче", "закрытым задачам", "закрытым задачам")
        + (cycleDept === CYCLE_ALL ? "" : " отдела «" + cycleDept + "»")
        + ", " + sprPlural(cycles.length, "прошедшей", "прошедшим", "прошедшим")
        + " через «В работе»"
        + (enough ? "" : "; мало данных для сравнения (n < " + CYCLE_MIN_SAMPLE + ")")
        + "; цель ≤ 5 рабочих дней";
    }
    if (stageTitle) stageTitle.textContent = "Где висит" + deptTail;
    if (stageBars) cycleFillStages(stageBars);

    assigneeBars.textContent = "";
    /* Порядок людей приходит из build.py (по числу задач, убывая) и
       фильтром не пересортировывается — одна сортировка, одно место.
       Пустые после фильтра корзины выпадают: полоса «0 / 0» ничего не
       сообщает, кроме того, что человек не занят чужим отделом. */
    const rows = (LIVE.assignees || []).map(function(a){
      const tasks = (a.tasks || []).filter(function(t){
        const row = CYCLE_ROW_BY_KEY[t.key];
        return !row || cycleInDept(row);
      });
      return {
        name: a.name,
        tasks: tasks,
        total: tasks.length,
        closed: tasks.filter(function(t){ return t.closed; }).length,
      };
    }).filter(function(a){ return a.total > 0; });

    /* concat([1]) держит знаменатель ненулевым: на пустом списке
       Math.max.apply вернул бы -Infinity, и ширина полос стала бы NaN%.
       Максимум берётся по показанному срезу — полосы сравнивают людей
       между собой внутри того, что сейчас на экране. */
    const maxTotal = Math.max.apply(null,
      rows.map(function(a){ return a.total; }).concat([1]));
    /* Полосы людей — нейтральный --c-new, тот же токен, каким карточки
       закрытых спринтов красят бары без статусного смысла (хотспоты багов,
       фолбэк sprDeptColor, заливка commitment). Загрузка человека — это факт,
       а не состояние задачи: --c-progress и --c-done тут соврали бы смыслом.
       Сам цвет выбирает sprAssigneeRow — он же строит раскрывашку со списком. */
    rows.forEach(function(a){
      assigneeBars.appendChild(sprAssigneeRow(a, maxTotal));
    });
    if (!rows.length){
      assigneeBars.appendChild(el("p", "spr-empty",
        "в этом отделе нет задач спринта"));
    }
  }
  cycleRedraw();

  /* «Качество данных» — не отдельная метрика, а дисклеймер к цифрам выше:
     каждая строка говорит, на какой доле спринта посчитан соседний KPI.
     Без неё «velocity 18 sp» читается как факт по всему спринту, хотя SP
     проставлены не везде. Блок молча пропускается, если расчёт пришёл без
     quality: таблица с пустыми ячейками хуже отсутствующей секции. */
  const q = LIVE.quality;
  if (q){
    const quality = el("div", "spr-section");
    quality.appendChild(el("h3", null, "Качество данных"));
    const table = document.createElement("table");
    table.className = "spr-history spr-quality";
    const tbody = document.createElement("tbody");
    [["Оценка проставлена", q.spFilled + " из " + q.total,
      "велосити в SP видит только эту долю спринта"],
     ["Исполнитель назначен", q.assigneeFilled + " из " + q.total,
      "загрузка по людям считается по этой доле"],
     ["Даты начала/дедлайна", q.datesFilled + " из " + q.total,
      "полосы задач на Ганте — производные, не плановые"],
     /* Пустая шкала — не ошибка, а валидный ответ «SP не ставят вовсе»;
        пустая строка от join() дала бы визуально сломанную ячейку. */
     ["Шкала оценки", (q.spScale || []).join(", ") || "—",
      "какие значения SP реально используются"]].forEach(function(row){
      const tr = document.createElement("tr");
      row.forEach(function(cell){ tr.appendChild(el("td", null, cell)); });
      tbody.appendChild(tr);
    });

    /* Строки цикла живут в той же таблице, а не в своей: «качество данных»
       отвечает на один вопрос — какой доле спринта можно верить, — и
       разносить ответ по двум блокам значило бы прятать половину.
       Считаются по всему спринту, а не по выбранному отделу: фильтр
       сужает взгляд на метрику, а дисклеймер описывает сами данные.
       Строка «История не загружена» появляется только когда есть о чём
       говорить: ноль здесь — не новость, а норма. */
    const cq = CYCLE && CYCLE.quality;
    if (cq){
      /* Знаменатель — закрытые С ЗАГРУЖЕННОЙ историей, а не все закрытые.
         Иначе задача, чью историю не дала сеть, попадала бы в «не прошла
         через В работе» — то есть сетевой сбой выглядел бы как способ
         ведения доски. Про недоехавшие говорит своя строка ниже. */
      const cycleRows = [
        ["Прошли через «В работе»",
         cq.withWork + " из " + cq.closed + " закрытых"
           + (cq.noHistoryClosed ? " (по " + cq.noHistoryClosed + " истории нет)" : ""),
         "только по ним считается cycle time; остальные закрыты минуя работу"],
        ["Возвращались из «Готово»", String(cq.reopened),
         "цикл меряется до последнего входа в «Готово»"],
        ["Ещё в работе", String(cq.running),
         "у них показан идущий цикл, в медиану они не входят"],
      ];
      if (cq.noHistory){
        cycleRows.push(["История не загружена", String(cq.noHistory),
          "по этим задачам цикл не измерен — это не ноль дней"]);
      }
      if (cq.truncated){
        cycleRows.push(["История неполная", String(cq.truncated),
          "changelog не дочитан до конца — цикл по ним занижен"]);
      }
      if (cq.broken){
        cycleRows.push(["История не разобрана", String(cq.broken),
          "записи кэша помечены негодными и будут перечитаны следующей сборкой"]);
      }
      cycleRows.forEach(function(row){
        const tr = document.createElement("tr");
        row.forEach(function(cell){ tr.appendChild(el("td", null, cell)); });
        tbody.appendChild(tr);
      });
    }
    table.appendChild(tbody);
    quality.appendChild(table);
    card.appendChild(quality);
  }

  /* «Capacity и focus factor» — единственный интерактив на всей вкладке, и
     это вынужденно: доступности людей (отпуска, дежурства, чужие проекты)
     в Трекере нет ни в каком виде, посчитать её на сборке не из чего.
     Поэтому вводные ставит PM ползунками, а из данных берётся ровно то, что
     в них есть: средняя велосити закрытых спринтов и объём взятого. */
  const calc = el("div", "spr-section");
  calc.appendChild(el("h3", null, "Capacity и focus factor"));

  const avg = avgVelocity();
  const commitment = LIVE.kpi.commitmentSp || 0;

  /* Дефолты — «как сейчас», а не круглые числа: калькулятор открывается на
     текущем составе и текущей длине спринта, так что первое, что PM видит, —
     сегодняшняя картина, а не абстрактная команда. Корзина «Не назначен» из
     размера команды исключена: это дыра в данных, а не человек. */
  const teamSize = (LIVE.assignees || []).filter(function(a){
    return a.name !== SPR_UNASSIGNED;
  }).length;
  const rows = el("div", "spr-bars");
  const inPeople = sprCalcRow("Людей в команде", 3, 14, teamSize, "");
  const inDays = sprCalcRow("Рабочих дней в спринте", 5, 15,
    (LIVE.burnup.workdays || []).length, "");
  /* 70% — единственная вводная, которой неоткуда взяться: ни Трекер, ни
     история спринтов доступность не хранят. Ровно об этом подпись снизу.
     Шаг 5, а не 1: доступность команды — прикидка «примерно две трети», и
     ползунок с точностью до процента врал бы о её природе. */
  const inAvail = sprCalcRow("Доступность", 30, 100, 70, "%", 5);
  const controls = [inPeople, inDays, inAvail];
  controls.forEach(function(c){ rows.appendChild(c.row); });
  calc.appendChild(rows);

  /* Вывод — та же сетка .spr-kpis, что у KPI спринта сверху: это тоже
     «несколько чисел в ряд», второй сетке взяться не с чего. Узлы строятся
     один раз, пересчёт меняет только текст: перестроение DOM на каждое
     движение ползунка дёргало бы вёрстку и рвало фокус на ползунке. */
  const outTiles = el("div", "spr-kpis");
  const tiles = ["capacity при этих вводных",
                 "focus factor, sp на чел-день",
                 "нужно на " + commitment + " sp спринта",
                 "дефицит команды"].map(function(caption){
    const tile = el("div", "spr-kpi-tile");
    const num = el("span", "n");
    const key = el("span", "k", caption);
    tile.appendChild(num);
    tile.appendChild(key);
    outTiles.appendChild(tile);
    return { n: num, k: key };
  });

  /** Пересчёт по вводным. Все деления безопасны: минимумы ползунков
   *  (3 человека · 5 дней · 30%) не дают capacity обнулиться, а нулевую
   *  среднюю велосити отсекает гвард ниже — плиток тогда просто нет. */
  function recalc(){
    controls.forEach(function(c){ c.out.textContent = c.read() + c.unit; });
    if (!avg) return;
    const people = inPeople.read();
    const days = inDays.read();
    const rate = inAvail.read() / 100;
    const capacityDays = people * days * rate;
    const ff = avg / capacityDays;
    const needDays = commitment / ff;
    /* Дефицит переводится в людей тем же курсом, каким считался capacity
       (день × доступность), иначе слово «человек» значило бы в двух плитках
       разное. Побочный эффект честной арифметики: ползунки дней и
       доступности здесь сокращаются — ff падает ровно во столько же раз, во
       сколько растёт capacity, — и дефицит зависит только от размера
       команды. Это не сбой пересчёта, а смысл величины: она отвечает на один
       вопрос — во сколько людей обходится разрыв между объёмом спринта и
       средней велосити. */
    const gap = needDays / (days * rate) - people;
    const gapText = Math.abs(gap).toFixed(1);
    tiles[0].n.textContent = Math.round(capacityDays) + " чел-дн.";
    tiles[1].n.textContent = ff.toFixed(2);
    tiles[2].n.textContent = Math.round(needDays) + " чел-дн.";
    tiles[3].n.textContent = gapText + " чел.";
    /* Подпись выбирается по уже округлённому числу, а не по сырому: иначе
       под «0.0 чел.» могло бы стоять слово «не хватает». */
    tiles[3].k.textContent = Number(gapText) === 0
      ? "объём равен средней велосити"
      : gap > 0 ? "не хватает людей" : "запас по людям";
  }
  controls.forEach(function(c){ c.input.addEventListener("input", recalc); });
  recalc();

  if (avg){
    calc.appendChild(outTiles);
  } else {
    /* Знаменателя нет — focus factor выводить не из чего. Ползунки при этом
       остаются: они показывают, какие вводные калькулятору понадобятся,
       когда первый спринт закроется. */
    calc.appendChild(el("p", "spr-empty",
      "нет закрытых спринтов в истории — focus factor считать не из чего"));
  }
  calc.appendChild(el("p", "spr-calc-note",
    "данных о доступности в Трекере нет — вводные твои; focus factor берётся"
    + " из истории спринтов"
    + (avg ? " (средняя велосити " + avg + " sp за 14 дней)" : "")));
  card.appendChild(calc);

  return card;
}

/** Подсказка по точке факта берндауна. Переиспользует #tip Ганта целиком —
 *  и узел, и его оформление (`#tip b`, `#tip dl/dt/dd`, `#tip .tip-hint`):
 *  элемент лежит на уровне body, вкладкой не скрывается и ни на чём из
 *  структуры Ганта не завязан. Своё здесь только содержимое.
 *
 *  План и прогноз хит-таргетов не получают намеренно: за ними нет данных.
 *  Плановая прямая и продолжение темпа — чистая геометрия, и «значение» в
 *  подсказке выдало бы расчётную величину за факт.
 *
 *  Подсказка — дополнение, а не единственный канал: остаток и закрытое
 *  стоят в KPI-плитках над чартом, до них можно дойти и без мыши. */
function sprBurndownTip(target, i, days, fact, total, x, y){
  const cum = fact[i];
  const iso = days[i];

  tip.textContent = "";
  /* Дата ISO-строкой парсится как UTC-полночь, поэтому день недели берётся
     UTC-геттером: локальный сдвинул бы его на сутки западнее Гринвича. */
  tip.appendChild(el("b", null,
    sprDateShort(iso) + ", " + WEEKDAYS[new Date(iso).getUTCDay()]));

  const dl = document.createElement("dl");
  function add(term, value){
    dl.appendChild(el("dt", null, term));
    dl.appendChild(el("dd", null, value));
  }
  add("Осталось", String(total - cum));
  add("Закрыто всего", String(cum));
  /* На первой точке дельты нет: в неё уже входят задачи, довезённые до
     «Готово» до старта спринта, и отделить их от закрытых в первый день
     данные не позволяют. Поэтому подпись говорит ровно то, что стоит в
     цифре, — «к первому дню», а не «за день», — а сноска ниже объясняет
     ступеньку, из-за которой линия факта стартует ниже total. */
  if (i > 0) add("Закрыто за день", "+" + (cum - fact[i - 1]));
  else add("Закрыто к первому дню", String(cum));
  tip.appendChild(dl);

  if (i === 0 && cum > 0){
    tip.appendChild(el("div", "tip-hint",
      "сюда попал хвост прошлой волны — задачи, перенесённые в спринт уже закрытыми"));
  }

  placeTip(target, x, y);
}

/** Burn-down текущего спринта: план, остаток и прогноз текущим темпом.
 *  Ось X — рабочие дни спринта: по календарным линия факта давала бы
 *  ложные плато на каждых выходных.
 *
 *  Данные приходят из build.py как накопленное число закрытых задач
 *  (`burnup.fact`) — эта величина универсальна: остаток из неё получается
 *  вычитанием из total, обратно — тем же вычитанием. Переворачивать расчёт
 *  на сборке было бы нечем: «осталось» — не другие данные, а другая
 *  геометрия рендера, и живёт она здесь, в одной функции.
 *
 *  Факт стартует ниже total, если в спринт перенесли уже закрытые задачи
 *  прошлой волны: их закрытие вычитается из остатка на первом же дне. Это
 *  ожидаемая ступенька, а не сбой, — принадлежность спринту здесь важнее
 *  даты закрытия (см. compute_live_sprint). */
function renderBurndown(){
  const wrap = el("div", "spr-chart");
  const days = LIVE.burnup.workdays || [];
  const fact = LIVE.burnup.fact || [];
  const total = LIVE.kpi.total;

  /* Спринт целиком выпал на выходные: осей нет — значит нет и чарта.
     Отдельная ветка нужна, чтобы не считать координаты по пустому
     массиву и не выводить путь из NaN. */
  if (!days.length){
    wrap.appendChild(el("p", "spr-empty",
      "В спринте нет рабочих дней — burn-down строить не по чему."));
    return wrap;
  }

  const legend = el("div", "legend spr-chart-legend");
  [["план", "repeating-linear-gradient(90deg,var(--text-dim) 0 5px,transparent 5px 9px)"],
   ["факт (осталось)", "var(--c-done)"],
   ["прогноз текущим темпом", "repeating-linear-gradient(90deg,var(--c-done) 0 5px,transparent 5px 9px)"]
  ].forEach(function(pair){
    const item = el("span");
    const swatch = el("i", "swatch");
    swatch.style.background = pair[1];
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(pair[0]));
    legend.appendChild(item);
  });
  wrap.appendChild(legend);

  const W = Math.max(680, days.length * 64), H = 240, L = 40, R = 14, T = 14, B = 36;
  const x = function(i){ return L + (W - L - R) / Math.max(days.length - 1, 1) * i; };
  const y = function(v){ return T + (H - T - B) * (1 - v / Math.max(total, 1)); };
  const svg = svgEl("svg", {viewBox: "0 0 " + W + " " + H, width: W, height: H});

  /* Ось Y не переворачивается вместе со смыслом: 0 внизу, total вверху —
     как было. Меняются только величины, которые по ней откладываются
     (остаток вместо накопленного закрытия), поэтому и подписи горизонталей
     остаются прежними.

     Сами горизонтали 0 и total задают масштаб: без них три линии висят
     в воздухе и «32» на глаз не отличить от «69». При total = 0 вторая
     линия легла бы на первую — рисуем только нулевую. */
  (total > 0 ? [[0, "0"], [total, String(total)]] : [[0, "0"]]).forEach(function(pair){
    svg.appendChild(svgEl("line", {x1:L, y1:y(pair[0]), x2:W-R, y2:y(pair[0]), stroke:"var(--line)"}));
    const label = svgEl("text", {x:L-8, y:y(pair[0])+4, "text-anchor":"end",
      "font-size":10, fill:"var(--text-dim)"});
    label.textContent = pair[1];
    svg.appendChild(label);
  });

  days.forEach(function(d, i){
    svg.appendChild(svgEl("line", {x1:x(i), y1:T, x2:x(i), y2:H-B,
      stroke:"var(--line)", "stroke-opacity":.4}));
    const tick = svgEl("text", {x:x(i), y:H-B+16, "text-anchor":"middle",
      "font-size":10, fill:"var(--text-dim)"});
    tick.textContent = d.slice(8, 10) + "." + d.slice(5, 7);
    svg.appendChild(tick);
  });

  /* План — идеальная прямая сгорания: от полного объёма к нулю в последний
     рабочий день. Ориентир читается сразу — «линия факта выше плана» значит
     «отстаём», и переводить это в голове не нужно.

     Левый конец стоит на total, а не на total*(N-1)/N: у burn-up план
     начинался со сдвигом на один день (первая точка — конец первого дня,
     как и у факта), здесь начало прямой якорится к старту спринта, где
     не сделано ещё ничего. Разница — один шаг сетки; классическая форма
     burn-down («полный объём → ноль») стоит того, чтобы её сохранить. */
  svg.appendChild(svgEl("path", {
    d: "M " + x(0) + " " + y(total) + " L " + x(days.length - 1) + " " + y(0),
    stroke:"var(--text-dim)", "stroke-width":1.5, "stroke-dasharray":"6 4", fill:"none"}));

  /* Здесь и происходит весь переворот: накопленное закрытие вычитается из
     total и превращается в остаток. Никакой другой разницы с burn-up нет —
     точки те же, отражены относительно середины шкалы. */
  const remaining = fact.map(function(closed){ return total - closed; });
  const pts = remaining.map(function(v, i){ return [x(i), y(v)]; });
  if (pts.length){
    svg.appendChild(svgEl("path", {
      d: pts.map(function(p, i){ return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" "),
      stroke:"var(--c-done)", "stroke-width":2, fill:"none",
      "stroke-linejoin":"round", "stroke-linecap":"round"}));
    const last = pts[pts.length - 1];
    svg.appendChild(svgEl("circle", {cx:last[0], cy:last[1], r:3.5, fill:"var(--c-done)"}));
  }

  /* Прогноз — не обещание, а продолжение темпа: сколько останется к концу
     спринта, если закрывать как закрывали. Клампится нулём: ниже «ничего
     не осталось» burn-down не опускается.

     Темп считается по приросту ОТ первой точки, а не от нуля. В fact[0]
     сидит хвост прошлой волны — задачи, перенесённые в спринт уже
     закрытыми, — и делить накопленное на число дней значило бы приписать
     команде чужую работу как её скорость: спринт, где не закрыли ничего,
     всё равно рисовал бы уверенно падающую линию.
     Закрытия самого первого дня в данных от carry-over неотделимы (обе
     величины схлопнуты в fact[0]), поэтому первый день исключается из
     темпа целиком. Прогноз от этого консервативный — он занижает скорость
     на реальную работу первого дня, — и это осознанный размен: лучше
     недообещать, чем показать команде темп, которого не было.
     Знаменатель через Math.max(…, 1) держит деление безопасным на
     единственной точке: прироста тогда нет вовсе, темп ноль.

     Нулевой темп — горизонталь, и теперь это правда буквально: «за спринт
     не закрыли ничего» даёт rate = 0 независимо от того, сколько задач
     приехало в спринт закрытыми. */
  if (pts.length && fact.length < days.length){
    const last = pts[pts.length - 1];
    const rate = (fact[fact.length - 1] - fact[0]) / Math.max(fact.length - 1, 1);
    const projected = Math.max(
      remaining[remaining.length - 1] - rate * (days.length - fact.length), 0);
    svg.appendChild(svgEl("path", {
      d: "M " + last[0] + " " + last[1] + " L " + x(days.length - 1) + " " + y(projected),
      stroke:"var(--c-done)", "stroke-width":1.5, "stroke-dasharray":"3 4",
      "stroke-opacity":.6, fill:"none"}));
  }

  /* Мишени наведения — последними, поверх всех линий: в SVG порядок в
     документе решает и перекрытие, и попадание мыши. Нарисуй их раньше —
     штрих прогноза у последней точки перехватывал бы курсор на себя.
     Радиус 16 вместо видимых 3.5: в точку такого размера надо попадать
     снайперски. Шаг сетки здесь ~70px, так что мишени соседних дней не
     смыкаются, и подсказка не «перепрыгивает» между днями.
     fill="transparent", а не "none": фигура без заливки события мыши
     пропускает сквозь себя, и наведение не сработало бы вовсе. */
  pts.forEach(function(p, i){
    const hit = svgEl("circle", {cx:p[0], cy:p[1], r:16, fill:"transparent"});
    hit.addEventListener("mousemove", function(e){
      sprBurndownTip(hit, i, days, fact, total, e.clientX, e.clientY);
    });
    hit.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
    svg.appendChild(hit);
  });

  /* Чарт прокручивается по горизонтали, а подсказка приклеена к экрану:
     без этого она осталась бы висеть над уже уехавшей точкой. Ганту то же
     самое делает его собственный обработчик на #gantt. */
  wrap.addEventListener("scroll", function(){ tip.style.display = "none"; },
    { passive: true });

  wrap.appendChild(svg);
  return wrap;
}

/** Велосити-чарт истории: столбик на каждый закрытый спринт, высота — велосити,
 *  приведённая к 14 дням (sprNormVelocity), пунктиром поперёк — средняя.
 *
 *  Приведение обязано быть подписано в легенде: в таблице ниже у S05 стоит
 *  89 sp, а над его столбиком — 96, и без пояснения это читается как
 *  расхождение данных, а не как другая единица измерения.
 *
 *  Живого спринта в чарте нет намеренно: финальной велосити у него ещё не
 *  существует, и столбик «сколько закрыто на сегодня» рядом с законченными
 *  спринтами читался бы как обвал темпа. Идущий спринт показывает burn-down
 *  выше по вкладке — там незаконченность видна по построению.
 *
 *  Возвращает null, когда закрытых спринтов нет: среднюю не по чему считать,
 *  а активный спринт снапшота таблица истории покажет и без чарта. */
function renderVelocityChart(){
  const closed = closedSprints().filter(function(s){
    /* Спринт без velocity_sp (снапшот заполняется руками) дал бы NaN в высоте
       своего столбика. Фильтр снимает ровно этот столбик и больше ничего:
       средняя считается ниже по полной выборке и от NaN закрыта отдельным
       гвардом там же. Дыру это не прячет — в таблице истории строкой ниже
       спринт остаётся как есть. */
    return Number.isFinite(sprNormVelocity(s));
  });
  if (!closed.length) return null;

  const wrap = el("div", "spr-chart spr-velo");

  const legend = el("div", "legend spr-chart-legend");
  [["велосити, приведённая к 14 дням", "var(--c-new)"],
   ["средняя", "repeating-linear-gradient(90deg,var(--text-dim) 0 5px,transparent 5px 9px)"]
  ].forEach(function(pair){
    const item = el("span");
    const swatch = el("i", "swatch");
    swatch.style.background = pair[1];
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(pair[0]));
    legend.appendChild(item);
  });
  wrap.appendChild(legend);

  const norms = closed.map(sprNormVelocity);
  /* Средняя намеренно берётся из общего avgVelocity(), а не пересчитывается
     по отфильтрованной выборке: норма команды — одно число на всю вкладку,
     и расходиться с focus factor она не должна. Плата за это — NaN, когда
     у спринта нет velocity_sp: фильтр выше убирает такой спринт из столбиков,
     но не из средней. Один NaN в Math.max ниже отравил бы top, а через него
     координаты всех элементов до единого — чарт пропал бы целиком, ровно от
     той дыры, которую фильтр обходил. Ноль вместо NaN гасится проверкой
     `if (avg > 0)`: пунктир средней исчезает, столбики остаются. */
  const rawAvg = avgVelocity();
  const avg = Number.isFinite(rawAvg) ? rawAvg : 0;
  const n = closed.length;

  /* Ширина растёт с числом спринтов ровно как у burn-down с числом дней:
     .spr-chart прокручивается по горизонтали, поэтому десятый спринт уезжает
     вправо, а не сплющивает подписи первых девяти. 78px на спринт — та
     ширина, при которой в слот ещё влезает нижняя строка «28.07 – 09.08».
     R шире L: в правом поле лежит подпись средней, и держать её там дешевле,
     чем ловить наложение на число над крайним столбиком. */
  const W = Math.max(680, 40 + 72 + n * 78), H = 260, L = 40, R = 72, T = 24, B = 44;

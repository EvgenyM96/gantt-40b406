      item.appendChild(el("span", "side", side.join(" · ")));

      list.appendChild(item);
    });
    section.appendChild(list);
    box.appendChild(section);
  });

  return total;
}

/* ── Дропдаун ───────────────────────────────────────── */

/**
 * Переиспользуемый выпадающий список. Возвращает { el, value, set }.
 * Нативный <select> не даёт ни счётчиков в строках, ни своего вида,
 * поэтому здесь свой — но на нативных <button> с ролями listbox/option,
 * чтобы клавиатура и скринридер работали без дописывания.
 *
 * @param {{items: Array, value: string, placeholder: string, onChange: Function}} config
 */
function createDropdown(config){
  /* multiple: значение — массив ключей, пункт с пустым value работает как
     сброс, меню после клика остаётся открытым (иначе отметить второй эпик
     стоит лишнего открытия). */
  const multiple = !!config.multiple;
  const wrap = el("div", "dd" + (multiple ? " is-multi" : ""));
  const btn = el("button", "dd-btn");
  btn.type = "button";
  btn.setAttribute("aria-haspopup", "listbox");
  btn.setAttribute("aria-expanded", "false");

  const label = el("span", "dd-label", config.placeholder);
  btn.appendChild(label);
  btn.appendChild(el("span", "dd-caret", "▼"));

  const menu = el("div", "dd-menu");
  menu.setAttribute("role", "listbox");
  if (multiple) menu.setAttribute("aria-multiselectable", "true");
  menu.hidden = true;

  let value = multiple ? (config.value || []).slice() : (config.value || "");

  function close(){
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
  function open(){
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    const active = menu.querySelector('[aria-selected="true"]') || menu.firstElementChild;
    if (active) active.focus();
  }

  function labelOf(key){
    const item = config.items.find(function(i){ return i.value === key; });
    return item && item.value ? item.label : config.placeholder;
  }

  /** Один выбранный показываем целиком: имя эпика информативнее счётчика.
   *  От двух — только счёт, полные имена в кнопку не помещаются. */
  function captionFor(next){
    if (!multiple) return labelOf(next);
    if (!next.length) return config.placeholder;
    if (next.length === 1) return labelOf(next[0]);
    return config.summary ? config.summary(next.length) : "Выбрано: " + next.length;
  }

  function isChosen(optValue, next){
    if (!multiple) return optValue === next;
    return optValue ? next.indexOf(optValue) !== -1 : next.length === 0;
  }

  function set(next, silent){
    value = multiple ? next.slice() : next;
    label.textContent = captionFor(value);
    btn.classList.toggle("is-set", multiple ? value.length > 0 : !!value);
    menu.querySelectorAll(".dd-opt").forEach(function(opt){
      opt.setAttribute("aria-selected", String(isChosen(opt.dataset.value, value)));
    });
    if (!silent && config.onChange) config.onChange(value);
  }

  config.items.forEach(function(item){
    const opt = el("button", "dd-opt");
    opt.type = "button";
    opt.setAttribute("role", "option");
    opt.setAttribute("aria-selected", String(isChosen(item.value, value)));
    opt.dataset.value = item.value;
    opt.appendChild(el("span", null, item.label));
    if (item.count != null) opt.appendChild(el("span", "dd-count", String(item.count)));
    opt.addEventListener("click", function(){
      if (!multiple){
        set(item.value);
        close();
        btn.focus();
        return;
      }
      if (!item.value){ set([]); return; }
      const without = value.filter(function(v){ return v !== item.value; });
      const next = without.length === value.length ? value.concat([item.value]) : without;
      set(next);
    });
    menu.appendChild(opt);
  });

  btn.addEventListener("click", function(){
    if (menu.hidden) open(); else close();
  });

  wrap.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !menu.hidden){ close(); btn.focus(); return; }
    if (menu.hidden) return;
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const options = [...menu.querySelectorAll(".dd-opt")];
    const index = options.indexOf(document.activeElement);
    const next = e.key === "ArrowDown" ? index + 1 : index - 1;
    if (options[next]) options[next].focus();
  });

  document.addEventListener("click", function(e){
    if (!wrap.contains(e.target)) close();
  });

  wrap.appendChild(btn);
  wrap.appendChild(menu);
  set(value, true);

  return { el: wrap, get value(){ return value; }, set: set };
}

/* ── Вид «Дерево» ───────────────────────────────────── */
const TREE = DATA.tree;
const TTL = TREE ? TREE.timeline : { from: 0, to: 1 };
let whoDropdown = null;

function buildTreeNode(key, level){
  const node = TREE.nodes[key];
  const wrap = el("div", "tnode");
  wrap.dataset.key = key;
  wrap.dataset.search = searchText(node);
  // Ветка считается завершённой, только если внутри не осталось живых задач.
  if (node.closed && !node.openInside) wrap.classList.add("all-closed");

  wrap.style.setProperty("--lvl", level);

  const row = el("div", "trow");
  row.style.setProperty("--lvl", level);
  if (node.closed) row.classList.add("closed");
  if (node.type === "Epic") row.classList.add("is-epic");
  if (node.type === "Story") row.classList.add("is-story");
  if (node.type === STAGE_TYPE) row.classList.add("is-stage");

  if (node.children.length){
    const btn = el("button", "ttw");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "t-" + key);
    btn.setAttribute("aria-label", "Развернуть " + key);
    row.appendChild(btn);
  } else {
    row.appendChild(el("span", "ttw-gap"));
  }

  row.appendChild(el("span", "tdot g-" + node.group));

  const link = el("a", "key", key);
  link.href = "https://tracker.yandex.ru/" + key;
  link.target = "_blank";
  link.rel = "noopener";
  row.appendChild(link);

  row.appendChild(el("span", "ttype", node.type));
  // Дисциплина отдельным бейджем: без неё непонятно, почему строка нашлась
  // по запросу «дизайн» — в названии стоит «[Design]», а поле, по которому
  // совпало, на экране до этого не показывалось вовсе.
  if (node.discipline){
    const disc = el("span", "tdisc", node.discipline);
    disc.dataset.stage = node.discipline;
    row.appendChild(disc);
  }
  row.appendChild(el("span", "tname", node.summary));

  if (node.openInside){
    const badge = el("span", "tinside", "живых внутри: " + node.openInside);
    row.appendChild(badge);
  }
  // Даты здесь текстом, а не полосой: увидеть срок полезно, рисовать
  // второй таймлайн рядом с Гантом — нет.
  if (node.bar) row.appendChild(el("span", "tdates", node.start + " → " + node.deadline));
  else if (node.point) row.appendChild(el("span", "tdates",
    (node.point.kind === "deadline" ? "до " : "с ") +
    (node.point.kind === "deadline" ? node.deadline : node.start)));

  row.appendChild(el("span", "tstatus", node.status));
  row.appendChild(el("span", "tass", node.assignee));

  wrap.appendChild(row);

  if (node.children.length){
    const kids = el("div", "tkids");
    kids.id = "t-" + key;
    kids.hidden = true;
    kids.style.setProperty("--lvl", level);
    node.children.forEach(function(child){ kids.appendChild(buildTreeNode(child, level + 1)); });
    wrap.appendChild(kids);
  }
  return wrap;
}

function renderTree(){
  const box = document.getElementById("tree");
  if (!TREE){
    box.appendChild(el("div", "tree-note", "Дерево недоступно: пересобери страницу с доступом к Трекеру."));
    return;
  }

  const body = el("div", "tree-body");
  box.appendChild(body);

  TREE.roots.forEach(function(key){ body.appendChild(buildTreeNode(key, 0)); });

  if (TREE.homeless.length){
    const btn = el("button", "tsection", "Вне эпиков — " + TREE.homeless.length);
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "t-homeless");
    const kids = el("div", "tkids");
    kids.id = "t-homeless";
    kids.hidden = true;
    TREE.homeless.forEach(function(key){ kids.appendChild(buildTreeNode(key, 0)); });
    body.appendChild(btn);
    body.appendChild(kids);
  }

  // Счётчик живых задач у каждого — сразу видно, у кого сейчас работа.
  const live = {};
  Object.values(TREE.nodes).forEach(function(n){
    if (!n.assignee) return;
    if (!n.closed) live[n.assignee] = (live[n.assignee] || 0) + 1;
    else if (live[n.assignee] == null) live[n.assignee] = 0;
  });

  const items = [{ value: "", label: "Все исполнители" }].concat(
    Object.keys(live).sort(function(a, b){ return live[b] - live[a] || a.localeCompare(b); })
      .map(function(name){ return { value: name, label: name, count: live[name] }; })
  );

  whoDropdown = createDropdown({
    items: items,
    value: "",
    placeholder: "Все исполнители",
    onChange: applyTreeFilter,
  });
  document.getElementById("who-slot").appendChild(whoDropdown.el);

  document.body.classList.add("tree-hide-done");
}

/** Фильтр дерева: человек и поиск действуют вместе, пересечением.
 *
 *  Оба критерия держат одну и ту же разметку — `on-path` на предках и
 *  `tree-filtered` на body, — поэтому считаются одним проходом. Двумя
 *  независимыми функциями второй стирал бы результат первого: выбрал
 *  человека, набрал текст — и человек молча сбрасывался.
 *
 *  Предков показываем всегда: без них лист висит в воздухе и непонятно,
 *  к какому эпику относится. */
function applyTreeFilter(){
  const box = document.getElementById("tree");
  const name = whoDropdown ? whoDropdown.value : "";
  const query = searchQuery();
  const hideDone = document.getElementById("tree-done").checked;

  box.querySelectorAll(".tnode").forEach(function(n){ n.classList.remove("on-path", "match"); });
  clearMarks(box);
  document.body.classList.toggle("tree-filtered", !!name || !!query);
  if (!name && !query) return;

  box.querySelectorAll(".tnode").forEach(function(wrap){
    const node = TREE.nodes[wrap.dataset.key];
    if (!node) return;
    if (name && node.assignee !== name) return;
    if (query && wrap.dataset.search.indexOf(query) === -1) return;
    // Закрытую задачу при включённом скрытии не тянем: иначе её предки
    // останутся в списке с кнопкой раскрытия, за которой пусто.
    if (hideDone && node.closed && !node.openInside) return;
    // Совпадение помечаем отдельно от пути: `on-path` получают и предки,
    // и сам узел — по нему видимость, но не по нему яркость.
    wrap.classList.add("match");
    if (query) highlightRow(wrap.querySelector(".trow"), query);
    let current = wrap;
    while (current && current !== box){
      if (current.classList && current.classList.contains("tnode")) current.classList.add("on-path");
      if (current.classList && current.classList.contains("tkids")){
        current.hidden = false;
        const owner = document.querySelector('[aria-controls="' + current.id + '"]');
        if (owner) owner.setAttribute("aria-expanded", "true");
      }
      current = current.parentElement;
    }
  });
}

document.getElementById("tree").addEventListener("click", function(e){
  const btn = e.target.closest(".ttw, .tsection");
  if (!btn) return;
  const box = document.getElementById(btn.getAttribute("aria-controls"));
  if (!box) return;
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  box.hidden = open;
});

document.getElementById("tree-done").addEventListener("change", function(e){
  document.body.classList.toggle("tree-hide-done", e.target.checked);
  // Состав пути зависит от того, скрыты ли завершённые, — пересчитываем.
  applyTreeFilter();
});
document.getElementById("tree-expand").addEventListener("click", function(){
  const buttons = document.querySelectorAll("#tree .ttw, #tree .tsection");
  const anyClosed = [...buttons].some(function(b){ return b.getAttribute("aria-expanded") === "false"; });
  buttons.forEach(function(b){
    b.setAttribute("aria-expanded", String(anyClosed));
    const box = document.getElementById(b.getAttribute("aria-controls"));
    if (box) box.hidden = !anyClosed;
  });
  this.textContent = anyClosed ? "Свернуть всё" : "Развернуть всё";
});

/** Фильтр по эпикам — один на оба вида: в Ганте прячет чужие группы,
 *  в дереве оставляет выбранные ветки целиком. Принимает список ключей;
 *  пустой список снимает фильтр. */
function filterByEpic(keys){
  const chosen = Array.isArray(keys) ? keys : (keys ? [keys] : []);
  document.body.classList.toggle("epic-filtered", chosen.length > 0);
  document.querySelectorAll("#gantt .grp, #tree .tree-body > .tnode").forEach(function(n){
    n.classList.toggle("epic-on", chosen.indexOf(n.dataset.key) !== -1);
  });
  chosen.forEach(expandEpic);
}

/** Разворачиваем выбранное: фильтр на свёрнутой ветке показал бы одну строку. */
function expandEpic(key){
  const group = document.querySelector('#gantt .grp[data-key="' + key + '"]');
  if (group){
    const btn = group.querySelector(".twisty");
    const kids = btn && document.getElementById(btn.getAttribute("aria-controls"));
    if (btn && kids){ btn.setAttribute("aria-expanded", "true"); kids.hidden = false; }
  }
  // В дереве раскрываем ветку целиком: смысл фильтра — увидеть весь состав
  // эпика, а не его первый уровень.
  const node = document.querySelector('#tree .tree-body > .tnode[data-key="' + key + '"]');
  if (node){
    node.querySelectorAll(".ttw").forEach(function(btn){
      btn.setAttribute("aria-expanded", "true");
      const kids = document.getElementById(btn.getAttribute("aria-controls"));
      if (kids) kids.hidden = false;
    });
  }
}

/* ── Вид «Спринты» ─────────────────────────────────────── */
/* Снапшот из data/sprints.json — метрики закрытых спринтов, посчитанные
 * build.py один раз при --close-sprint. Страница их не пересчитывает:
 * Трекер переписывает историю, и живой пересчёт закрытого спринта задним
 * числом даёт ложную картину (см. README и комментарий в build.py). */

/** Цвет полосы отдела — те же токены, что красят дисциплину на Ганте
 *  и в Дереве (`.row[data-stage]`, DISCIPLINES в build.py). Свой набор
 *  цветов здесь означал бы, что «Бэкенд» синий на одной вкладке и другого
 *  цвета на соседней — то же расхождение каналов, которого по всему
 *  инструменту старательно избегали. */
const SPR_DEPT_COLOR = {
  "Бэкенд": "var(--c-back)",
  "Фронтенд": "var(--c-front)",
  "Аналитика": "var(--c-analysis)",
  "Дизайн": "var(--c-design)",
};
function sprDeptColor(name){ return SPR_DEPT_COLOR[name] || "var(--c-new)"; }

/** Русское склонение по числу — единственное место, где вкладке «Спринты»
 *  это нужно (подпись бара «N задач»). */
function sprPlural(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return one;
  if ([2, 3, 4].indexOf(mod10) !== -1 && [12, 13, 14].indexOf(mod100) === -1) return few;
  return many;
}

function sprDate(iso){
  return iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4) : "?";
}

/** Одна строка бар-чарта: подпись слева, полоса, значение справа.
 *  Общая разметка для всех четырёх бар-чартов карточки — они отличаются
 *  только источником данных и цветом заливки. */
function sprBarRow(name, value, valueLabel, max, color){
  const row = el("div", "spr-bar-row");
  row.appendChild(el("span", "spr-bar-name", name));
  const track = el("div", "spr-bar-track");
  const fill = el("div", "spr-bar-fill");
  fill.style.width = (max > 0 ? Math.max(2, (value / max) * 100) : 0) + "%";
  fill.style.background = color;
  track.appendChild(fill);
  row.appendChild(track);
  row.appendChild(el("span", "spr-bar-val", valueLabel));
  return row;
}

/** Сводка сверху вкладки: таблица истории всех спринтов и тренд velocity. */
function renderSprintSummary(){
  const box = el("div", "spr-summary");
  box.appendChild(el("h2", null, "История спринтов"));

  if (!SPRINTS.length){
    box.appendChild(el("p", "spr-empty",
      "Спринтов в снапшоте пока нет — закрой первый флагом --close-sprint (см. README)."));
    return box;
  }

  const table = document.createElement("table");
  table.className = "spr-history";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  ["Спринт", "Даты", "Commitment", "Velocity", "Completion", "Carry-over", "Баги"].forEach(function(label){
    headRow.appendChild(el("th", null, label));
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  SPRINTS.forEach(function(s){
    const row = document.createElement("tr");
    row.appendChild(el("td", null, s.name));
    row.appendChild(el("td", null, sprDate(s.start) + " – " + sprDate(s.end)));
    row.appendChild(el("td", null, s.commitment_sp + " sp"));
    row.appendChild(el("td", null, s.velocity_sp + " sp"));
    row.appendChild(el("td", null, s.completion_pct + "%"));
    row.appendChild(el("td", null, s.carry_tasks + " · " + s.carry_sp + " sp"));
    row.appendChild(el("td", null, s.bugs_count + " (" + s.bugs_pct + "%)"));
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  box.appendChild(table);

  const trend = el("div", "spr-trend");
  trend.appendChild(el("h3", null, "Velocity по спринтам"));
  const bars = el("div", "spr-bars");
  const maxVelocity = Math.max.apply(null, SPRINTS.map(function(s){ return s.velocity_sp; }).concat([1]));
  SPRINTS.forEach(function(s){
    bars.appendChild(sprBarRow(s.id, s.velocity_sp, s.velocity_sp + " sp", maxVelocity, "var(--c-progress)"));
  });
  trend.appendChild(bars);
  box.appendChild(trend);

  return box;
}

/** Одна карточка спринта — печатный отчёт один в один: шапка, KPI-строка,
 *  четыре бар-чарта, сноска про источник данных. */
function renderSprintCard(s){
  const card = el("div", "spr-card");

  const head = el("div", "spr-card-head");
  const titleBox = el("div");
  titleBox.appendChild(el("h2", null, s.name));
  const statusLabel = s.status === "closed" ? "закрыт" : s.status === "active" ? "активен" : (s.status || "");
  titleBox.appendChild(el("div", "spr-dates", sprDate(s.start) + " – " + sprDate(s.end) + " · " + statusLabel));
  head.appendChild(titleBox);
  if (s.note) head.appendChild(el("div", "spr-note", s.note));
  card.appendChild(head);

  function kpiItem(num, label, sub){
    const item = el("div", "spr-kpi-item");
    item.appendChild(el("div", "spr-kpi-num", num));
    item.appendChild(el("div", "spr-kpi-label", label));
    if (sub) item.appendChild(el("div", "spr-kpi-sub", sub));
    return item;
  }
  const kpi = el("div", "spr-kpi");
  kpi.appendChild(kpiItem(s.velocity_sp + " sp", "Velocity (сделано)"));
  kpi.appendChild(kpiItem(String(s.closed_tasks), "задач закрыто"));
  kpi.appendChild(kpiItem(s.completion_pct + "%", "Completion", "норма 80–90%"));
  kpi.appendChild(kpiItem(s.carry_tasks + " · " + s.carry_sp + " sp", "перенесено"));
  kpi.appendChild(kpiItem(String(s.bugs_count), "багов заведено", s.bugs_pct + "% объёма"));
  card.appendChild(kpi);

  const byComponent = s.by_component || [];
  if (byComponent.length){
    const section = el("div", "spr-section");
    section.appendChild(el("h3", null, "Сделано по отделам"));
    const bars = el("div", "spr-bars");
    const max = Math.max.apply(null, byComponent.map(function(c){ return c.sp; }).concat([1]));
    byComponent.forEach(function(c){
      const label = c.sp + " sp · " + c.tasks + " " + sprPlural(c.tasks, "задача", "задачи", "задач");
      bars.appendChild(sprBarRow(c.name, c.sp, label, max, sprDeptColor(c.name)));
    });
    section.appendChild(bars);
    card.appendChild(section);
  }

  const commitSection = el("div", "spr-section");
  commitSection.appendChild(el("h3", null, "Взято в спринт vs сделано"));
  const track = el("div", "spr-commit-track");
  const fill = el("div", "spr-commit-fill");
  fill.style.width = (s.commitment_sp > 0 ? Math.min(100, 100 * s.velocity_sp / s.commitment_sp) : 0) + "%";
  track.appendChild(fill);
  commitSection.appendChild(track);
  const labels = el("div", "spr-commit-labels");
  labels.appendChild(el("span", null, s.velocity_sp + " сделано"));
  labels.appendChild(el("span", null, s.commitment_sp + " sp взято"));
  commitSection.appendChild(labels);
  card.appendChild(commitSection);

  const hotspots = s.bug_hotspots || [];
  if (hotspots.length){
    const section = el("div", "spr-section");
    section.appendChild(el("h3", null, "Баги: где кучкуются"));
    const bars = el("div", "spr-bars");
    const max = Math.max.apply(null, hotspots.map(function(h){ return h.count; }).concat([1]));
    hotspots.forEach(function(h){
      bars.appendChild(sprBarRow(h.name, h.count, String(h.count), max, "var(--c-new)"));
    });
    section.appendChild(bars);
    card.appendChild(section);
  }

  const byStack = s.bugs_by_stack || [];
  if (byStack.length){
    const section = el("div", "spr-section");
    section.appendChild(el("h3", null, "Баги по стеку"));
    const bars = el("div", "spr-bars");
    const max = Math.max.apply(null, byStack.map(function(b){ return b.count; }).concat([1]));
    byStack.forEach(function(b){
      bars.appendChild(sprBarRow(b.name, b.count, String(b.count), max, sprDeptColor(b.name)));
    });
    section.appendChild(bars);
    card.appendChild(section);
  }

  card.appendChild(el("div", "spr-footnote",
    "Данные: Яндекс Трекер · velocity по листовым задачам (типы «Задача» + «Ошибка»), " +
    "контейнеры не считаются · метрики уровня команды — не для оценки людей"));

  return card;
}

/** Рисует вкладку целиком: сводка сверху, затем карточки от новых к старым —
 *  последний закрытый спринт интересует чаще всего, ему и стоять первым. */
function renderSprints(){
  const box = document.getElementById("sprints");
  box.textContent = "";
  box.appendChild(renderSprintSummary());
  SPRINTS.slice().reverse().forEach(function(s){
    box.appendChild(renderSprintCard(s));
  });
}

function setView(view){
  document.body.setAttribute("data-view", view);
  document.getElementById("view-gantt").setAttribute("aria-pressed", String(view === "gantt"));
  document.getElementById("view-problems").setAttribute("aria-pressed", String(view === "problems"));
  document.getElementById("view-tree").setAttribute("aria-pressed", String(view === "tree"));
  document.getElementById("view-sprints").setAttribute("aria-pressed", String(view === "sprints"));
  tip.style.display = "none";
}
document.getElementById("today").addEventListener("click", scrollToToday);
document.getElementById("view-gantt").addEventListener("click", function(){ setView("gantt"); });
document.getElementById("view-problems").addEventListener("click", function(){ setView("problems"); });
document.getElementById("view-tree").addEventListener("click", function(){ setView("tree"); });
document.getElementById("view-sprints").addEventListener("click", function(){ setView("sprints"); });

/* ── Запуск ─────────────────────────────────────────── */
root.style.setProperty("--day-px", SCALES[scale] + "px");
root.setAttribute("data-scale", scale);
renderScale();
const rendered = renderRows();

const problemCount = renderProblems();
if (problemCount) document.getElementById("prob-badge").textContent = "· " + problemCount;
renderTree();
renderSprints();

// Фильтр по эпикам: список берём из дерева — там у эпика виден весь
// его состав, включая фазы, которых нет в выборке Ганта.
if (TREE){
  const epicItems = [{ value: "", label: "Все эпики" }].concat(
    TREE.roots.map(function(key){
      return {
        value: key,
        label: key + " · " + TREE.nodes[key].summary,
        count: TREE.nodes[key].openInside || 0,
      };
    })
  );
  const epicDropdown = createDropdown({
    items: epicItems,
    value: [],
    multiple: true,
    placeholder: "Все эпики",
    summary: function(n){
      const tail = n % 10 === 1 && n % 100 !== 11 ? "эпик"
        : [2, 3, 4].indexOf(n % 10) !== -1 && [12, 13, 14].indexOf(n % 100) === -1 ? "эпика"
        : "эпиков";
      return n + " " + tail;
    },
    onChange: filterByEpic,
  });
  document.getElementById("epic-slot").appendChild(epicDropdown.el);
}

setView("gantt");

document.getElementById("stamp").textContent =
  "данные на " + META.generatedAt.slice(8,10) + "." + META.generatedAt.slice(5,7) + "." +
  META.generatedAt.slice(0,4) + " " + META.generatedAt.slice(11,16);

/** Сколько живой работы вообще попадает на роадмап.
 *
 *  Считаем по листьям дерева, а не по строкам Ганта: руками делают именно
 *  листья, эпик и стори — контейнеры. Пустые эпики и стори из счёта исключены:
 *  формально они листья, но работой не являются, и для них есть своя группа
 *  в «Проблемах».
 *
 *  Задача попадает на Гант, только если у её эпика проставлены даты, — сам
 *  лист на диаграмме не рисуется. Поэтому «не видно» распадается на две
 *  разные причины, и лечатся они по-разному: одной задаче нужен родитель,
 *  другой — даты у эпика. */
function coverage(){
  if (!TREE) return null;
  const nodes = TREE.nodes;

  function epicOf(key){
    const seen = new Set();
    let node = nodes[key];
    while (node && !seen.has(node.key)){
      seen.add(node.key);
      node = node.parent ? nodes[node.parent] : null;
      if (node && node.type === "Epic") return node;
    }
    return null;
  }

  const stat = { total: 0, shown: 0, noEpic: 0, epicNoDates: 0 };
  Object.keys(nodes).forEach(function(key){
    const node = nodes[key];
    if (node.closed || node.children.length) return;
    if (node.type === "Epic" || node.type === "Story") return;
    stat.total++;
    const epic = epicOf(key);
    if (epic && (epic.start || epic.deadline)) stat.shown++;
    else if (epic) stat.epicNoDates++;
    else stat.noEpic++;
  });
  return stat;
}

const cov = coverage();
const c = META.counts;
document.getElementById("footer").textContent =
  /* Формулировка без числительных в косвенных падежах: числа меняются
     при каждой пересборке, а «31 живых задач» и «71 задача» требуют разного
     склонения. Двоеточие снимает вопрос вовсе. */
  (cov && cov.total
    ? "Живой работы: " + cov.total + " · на роадмапе видно: " + cov.shown +
      " · вне роадмапа: " + (cov.total - cov.shown) +
      " (без эпика " + cov.noEpic + ", под эпиком без дат " + cov.epicNoDates + ")"
    : "Живой план: " + c.openWithBar + " из " + c.open + " открытых строк датировано") +
  (c.onePoint ? " · одна дата из двух: " + c.onePoint : "") +
  "  ·  всего отрисовано " + rendered + " из " + c.fetched +
  " (эпиков " + c.epics + ", стори " + c.stories + ", без эпика " + c.orphans + ")" +
  (rendered === c.fetched ? "" : "  ⚠ ЧАСТЬ СТРОК ПОТЕРЯНА");

scrollToToday(false);
})();

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Роадмап MCA — Гант</title>
<style>
/* Светлая тема — по умолчанию и всегда, независимо от системной.
   Тёмная включается только явным тумблером: артефакт чаще смотрят
   и скриншотят при свете, чем в тёмной. */
:root{
  --day-px: 18px;
  --name-w: 380px;
  --tname-w: 470px;
  --row-h: 38px;
  --head-h: 48px;
  --tstep: 26px;

  --bg: #fafbfc;
  --surface: #fff;
  --line: #e2e5ea;
  --line-soft: #eef0f4;
  /* Сетка по дням — самый частый элемент на экране: одна линия на каждый
     день всей шкалы. Держим её на пороге видимости, иначе полотно рябит. */
  --grid: #f1f3f7;
  --text: #1f2227;
  --text-dim: #7d848f;
  --band: #f4f6f8;
  --weekend: #eef1f5;

  --c-new: #8b93a1;
  --c-planned: #6284e8;
  --c-planned-label: #ffffff;
  --c-epic: #d9932e;
  --c-progress: #2f6fd0;
  --c-design: #8b5cd6;
  --c-analysis: #c77d1a;
  --c-back: #3452b5;
  --c-front: #0f8b8d;
  --c-done: #2f9e44;
  --c-urgent: #c8553d;
  --today: #d2453a;
  --hover: rgb(0 0 0 / .035);
  /* Маркер поиска. Тёплый жёлтый по тёмному тексту — единственная заливка,
     не занятая ни статусом, ни дисциплиной. */
  --mark: #ffdf7e;
  --mark-line: #e0a92a;

  /* Статусы цикла задачи («Где висит», стек в раскрывашке исполнителя).
     Не новая палитра, а псевдонимы уже занятых токенов: «В работе» синяя
     ровно тем же синим, каким Гант красит работу в процессе, «На доработку»
     — красным срочного. Подстановка var() происходит в момент применения,
     поэтому тёмная тема достаётся даром: переопределять псевдонимы ниже
     нечего, они возьмут уже перекрашенный --c-*.
     Настоящий новый цвет здесь один — --st-other, для статусов вне цикла
     (возврат в «Беклог» после отката). Он задан в обеих темах. */
  --st-work: var(--c-progress);
  --st-rework: var(--c-urgent);
  --st-review: var(--c-design);
  --st-cantest: var(--c-analysis);
  --st-testing: var(--c-front);
  --st-other: #b3b9c4;
}
:root[data-theme="dark"]{
  --bg: #16181c;
  --surface: #1d2026;
  --line: #313640;
  --line-soft: #262a31;
  --grid: #1f242b;
  --text: #e6e9ee;
  --text-dim: #888f9a;
  --band: #1f2228;
  --weekend: #22262e;

  --c-new: #868e9c;
  --c-planned: #4a67c0;
  --c-planned-label: #eef1f8;
  --c-epic: #e0a63d;
  --c-progress: #4d8ee8;
  --c-design: #a17ce0;
  --c-analysis: #d9942e;
  --c-back: #6c86e0;
  --c-front: #2ab0b2;
  --c-done: #3fb954;
  --c-urgent: #d46853;
  --today: #e0574c;
  --hover: rgb(255 255 255 / .045);
  /* На тёмной теме заливка полупрозрачная: сплошной жёлтый съедает
     светлый текст, который поверх него и остаётся. */
  --mark: rgb(217 148 46 / .42);
  --mark-line: #d9942e;

  /* Единственный статусный цвет без собственного токена на светлой теме —
     здесь он темнеет, иначе светло-серый сегмент выбеливает полосу на
     тёмном фоне. Остальные --st-* переопределять не нужно: они псевдонимы
     --c-*, перекрашенных выше. */
  --st-other: #4a515c;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  display:grid;
  grid-template-rows:auto auto 1fr;
  height:100dvh;
  background:var(--bg);
  color:var(--text);
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* Ярусы расписаны явно, а не отданы авто-раскладке: строка-сводка живёт
   только на Ганте, и на остальных вкладках вид сползал бы в её ярус —
   там `auto`, и вид остался бы без 1fr, то есть без своей прокрутки. */
#kpis{grid-row:2}
#gantt,#problems,#tree,#sprints{grid-row:3}

/* ── Тулбар ───────────────────────────────────────────── */
.toolbar{
  grid-row:1;
  display:flex; flex-direction:column; gap:11px;
  padding:13px 22px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.tb-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; min-height:30px}

/* Ряд инструментов принадлежит виду: у «Проблем» своих контролов нет,
   пустая полоса под шапкой читалась бы как сломанная вёрстка. */
body[data-view="problems"] .tb-row--tools,
body[data-view="sprints"] .tb-row--tools{display:none}

.tb-push{margin-left:auto}
.tb-aside{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.tb-aside .legend{margin-left:0}
.toolbar h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; white-space:nowrap}
.stamp{color:var(--text-dim); font-size:12px; white-space:nowrap}

/* Контролы тулбара — пилюли, как в макете платформы: одинаковая высота,
   полное скругление, тонкая граница. Радиус в пикселях, а не 50%: при
   любой ширине торцы остаются полукруглыми, а середина не искажается. */
.search{
  width:270px; padding:6px 14px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--bg); color:var(--text); font:inherit; font-size:12px;
}
.search::placeholder{color:var(--text-dim)}
.search:focus{outline:2px solid var(--c-progress); outline-offset:-1px}

.seg{display:flex; gap:2px; padding:2px; border-radius:999px; background:var(--line-soft)}
.seg button{
  padding:5px 14px; border:0; border-radius:999px;
  background:transparent; color:var(--text-dim);
  font:inherit; font-size:12px; cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--c-progress); color:#fff}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface); color:var(--text)}

.controls{display:flex; gap:12px; font-size:12px; color:var(--text-dim); white-space:nowrap}
.controls label{display:flex; align-items:center; gap:6px; cursor:pointer}

.icon-btn{
  padding:6px 14px; border:1px solid var(--line); border-radius:999px;
  background:var(--surface); color:var(--text-dim); font:inherit; font-size:12px; cursor:pointer;
}
.icon-btn:hover{background:var(--line-soft); color:var(--text)}

/* ── Дропдаун (переиспользуемый) ──────────────────────── */
.dd{position:relative; display:inline-block}
.dd-btn{
  display:flex; align-items:center; gap:8px;
  min-width:170px; padding:6px 14px;
  border:1px solid var(--line); border-radius:999px;
  background:var(--surface); color:var(--text);
  font:inherit; font-size:12px; cursor:pointer; text-align:left;
}
.dd-btn:hover{border-color:var(--text-dim)}
.dd-btn:focus-visible{outline:2px solid var(--c-progress); outline-offset:-1px}
.dd-btn[aria-expanded="true"]{border-color:var(--c-progress)}
.dd-label{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dd-btn.is-set .dd-label{font-weight:600}
.dd-caret{flex:0 0 auto; font-size:9px; color:var(--text-dim); transition:transform .12s}
.dd-btn[aria-expanded="true"] .dd-caret{transform:rotate(180deg)}

.dd-menu{
  position:absolute; top:calc(100% + 4px); left:0; z-index:60;
  min-width:100%; max-height:320px; overflow:auto;
  padding:6px; border:1px solid var(--line); border-radius:16px;
  background:var(--surface); box-shadow:0 8px 24px rgb(0 0 0 / .14);
}
.dd-opt{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:7px 12px; border:0; border-radius:999px;
  background:transparent; color:var(--text);
  font:inherit; font-size:12px; text-align:left; cursor:pointer; white-space:nowrap;
}
.dd-opt:hover,.dd-opt:focus-visible{background:var(--line-soft); outline:none}
.dd-opt[aria-selected="true"]{color:var(--c-progress); font-weight:600}
.dd-opt[aria-selected="true"]::after{content:"✓"; margin-left:auto; font-size:11px}
.dd-count{margin-left:auto; font-size:11px; color:var(--text-dim); font-weight:400}

/* Мультивыбор: у отмечаемых пунктов квадратный маркер слева — без него
   неочевидно, что выбрать можно несколько, а меню после клика не закрывается.
   Пункт-сброс («Все эпики») маркера не получает: он не один из набора. */
.dd.is-multi .dd-opt:not([data-value=""])::before{
  content:""; flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px;
  border:1px solid var(--line); border-radius:5px;
  font-size:10px; line-height:1; color:#fff;
}
.dd.is-multi .dd-opt:not([data-value=""])[aria-selected="true"]::before{
  content:"✓"; background:var(--c-progress); border-color:var(--c-progress);
}
.dd.is-multi .dd-opt:not([data-value=""])[aria-selected="true"]::after{content:none}

.legend{display:flex; gap:12px; flex-wrap:wrap; margin-left:auto; font-size:12px; color:var(--text-dim)}
.legend span{display:flex; align-items:center; gap:5px; white-space:nowrap}
.swatch{width:16px; height:8px; border-radius:2px; display:inline-block}
.legend .tdot{flex:0 0 9px}
.diamond{
  width:9px; height:9px; display:inline-block; transform:rotate(45deg);
  background:var(--surface); border:2px solid var(--c-new);
}
.lvl-hint b{font-weight:600; color:var(--text)}
.lvl-hint em{font-style:normal; font-weight:500; color:var(--text)}

/* ── Строка-сводка Ганта ──────────────────────────────── */
/* Плитки те же, что у текущего спринта (.spr-kpis / .spr-kpi-tile ниже
   по файлу) — переиспользуем сетку, а не копируем её. Здесь это строка
   над диаграммой, а не дашборд: плитки ниже и число мельче, иначе шапка
   Ганта съедает высоту, ради которой диаграмму и открывают.
   Переопределения повешены на #kpis: специфичность идентификатора
   не зависит от того, выше или ниже по файлу лежит исходное правило. */
#kpis{
  padding:10px 20px 11px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
#kpis .spr-kpis{margin:0}
/* Межстрочный интервал плотнее базового: три строки в плитке (число,
   подпись, расшифровка) на дефолтных 1.4 отъедали у диаграммы лишний
   десяток пикселей ни за что. */
#kpis .spr-kpi-tile{padding:8px 12px; gap:1px; line-height:1.25}
#kpis .spr-kpi-tile .n{font-size:18px}
#kpis .spr-kpi-tile .k{font-size:11px}
#kpis .kpis-note{margin:8px 2px 0; font-size:11px; color:var(--text-dim)}
/* Потеря строк — не мелкий шрифт под плитками, а сигнал «данные битые»:
   красим тем же токеном, что просроченные и сломанные даты на Ганте. */
#kpis .kpis-warn{margin-left:8px; color:var(--c-urgent); font-weight:600}

/* ── Скроллер ─────────────────────────────────────────── */
#gantt{overflow:auto; min-height:0; position:relative; background:var(--surface)}

/* Ширина обязана совпадать у шапки и у строк, иначе при горизонтальной
   прокрутке шапка отлипнет и разъедется со строками. */
/* Обёртка секции обязана быть шириной со всю шкалу, а не с экран:
   sticky-заголовок липнет только в пределах своего родителя, и на узкой
   обёртке он уезжал влево, стоило прокрутить дальше ширины окна. */
.head,.row,.section-wrap{min-width:calc(var(--name-w) + var(--total-d) * var(--day-px))}

.head{
  position:sticky; top:0; z-index:30;
  display:flex; height:var(--head-h);
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.head-name{
  position:sticky; left:0; z-index:31;
  width:var(--name-w); flex:0 0 var(--name-w);
  display:flex; align-items:center; padding:0 12px;
  background:var(--surface);
  border-right:1px solid var(--line);
  font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);
}
.head-scale{position:relative; flex:1}

/* Позиции считаются браузером из номера дня и текущего масштаба —
   при смене --day-px всё пересчитывается само, без перерисовки DOM. */
.month,.week,.day-cell,.weekend,.bar,.bar-fact{
  left:calc(var(--from) * var(--day-px));
  width:calc(var(--len) * var(--day-px));
}
.month{
  position:absolute; top:0; height:100%;
  display:flex; align-items:center; padding-left:6px;
  border-left:1px solid var(--line-soft);
  font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden;
}
.month.q{border-left-color:var(--line); font-weight:600; color:var(--text)}
:root[data-scale="week"] .month{height:22px; border-bottom:1px solid var(--line-soft)}
.week{
  position:absolute; top:22px; bottom:0;
  display:flex; align-items:center; padding-left:4px;
  border-left:1px solid var(--line-soft);
  font-size:10px; color:var(--text-dim); white-space:nowrap; overflow:hidden;
}
:root[data-scale="day"] .month{height:22px; border-bottom:1px solid var(--line-soft)}

/* Дневной масштаб: число и день недели друг под другом. Без дня недели
   дата не читается — «14.07 это вторник или среда» нельзя высчитать глазом. */
.day-cell{
  position:absolute; top:22px; bottom:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:1px; border-left:1px solid var(--line-soft);
  font-size:10px; line-height:1.1; color:var(--text-dim); overflow:hidden;
}
.day-cell b{font-weight:600; color:var(--text)}
.day-cell.off b{color:var(--text-dim); font-weight:400}
.day-cell.mon{border-left-color:var(--line)}
.day-cell.now b{color:var(--today)}
.day-cell.now i{color:var(--today)}
.day-cell i{font-style:normal}

.body{position:relative}
/* Ширина — по всей шкале, а не по видимой области: `right:0` обрезал слой
   шириной с экран, и фоновая сетка обрывалась на первых днях. */
.bands{
  position:absolute; top:0; bottom:0;
  left:var(--name-w); width:calc(var(--total-d) * var(--day-px));
  z-index:0; pointer-events:none;
}

/* Дневная сетка — фоном, а не сотнями узлов: на горизонте в 250 дней
   разница между градиентом и DOM заметна на глаз при прокрутке.
   В месячном масштабе не рисуется: 4.5px на день дают сплошную заливку. */
:root[data-scale="week"] .bands,
:root[data-scale="day"] .bands{
  background-image:repeating-linear-gradient(
    to right,
    var(--grid) 0 1px,
    transparent 1px var(--day-px)
  );
}
.weekend{position:absolute; top:0; bottom:0; background:var(--weekend)}
.today{
  position:absolute; top:0; bottom:0; width:2px; background:var(--today); opacity:.75;
  left:calc(var(--today-d) * var(--day-px));
}
.today::after{
  content:"сегодня"; position:absolute; top:2px; left:4px;
  font-size:10px; color:var(--today); white-space:nowrap;
}

/* ── Строки ───────────────────────────────────────────── */
.row{display:flex; position:relative; z-index:1; height:var(--row-h); align-items:stretch}
.row:hover{background:var(--hover)}

.cell-name{
  position:sticky; left:0; z-index:2;
  width:var(--name-w); flex:0 0 var(--name-w);
  display:flex; align-items:center; gap:6px; padding:0 10px 0 8px;
  background:var(--surface);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line-soft);
  overflow:hidden;
}
.row:hover .cell-name{background:color-mix(in srgb, var(--surface) 94%, var(--text))}
.cell-track{position:relative; flex:1; border-bottom:1px solid var(--line-soft)}

.twisty{
  flex:0 0 18px; width:18px; height:18px; padding:0;
  display:grid; place-items:center;
  border:0; border-radius:4px; background:transparent; cursor:pointer;
  color:var(--text-dim); font-size:10px; line-height:1;
}
.twisty:hover{background:var(--line-soft); color:var(--text)}
.twisty::before{content:"▶"; transition:transform .12s}
.twisty[aria-expanded="true"]::before{transform:rotate(90deg)}
.twisty-spacer{flex:0 0 18px}

.key{
  flex:0 0 auto; font-size:11px; color:var(--text-dim);
  text-decoration:none; font-variant-numeric:tabular-nums;
}
.key:hover{color:var(--c-progress); text-decoration:underline}
.title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1 1 auto; cursor:default}

/* Ярус кодируют размер, вес и высота строки: эпик крупный, стори
   полужирная, стадия мелкая и приглушённая. Текстовые бейджи
   Epic/Story убраны — иерархию несёт типографика (решение владельца
   по прототипу). Бейдж остался только у стадий: он кодирует дисциплину.
   Заливки у строки эпика нет намеренно: со свёрнутыми эпиками подряд
   она сливалась в сплошное серое полотно на всю ширину графика. */
.row--epic{height:calc(var(--row-h) * 1.35)}
.row--epic .title{font-weight:700; font-size:15px}
.row--story .title{font-weight:600}
.row--story .cell-name{padding-left:26px}
.row--stage{height:calc(var(--row-h) * .85)}

/* Корона — эпик, знакомый язык Трекера. Остальным ярусам иконки не нужны:
   их уже разводят размер и отступ, второй знак стал бы двойным кодированием. */
.tier-crown{flex:0 0 15px; display:inline-flex; color:var(--c-epic)}

/* Дисциплина стадии — тем же языком, что и в дереве. */
.gtype{
  flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:4px;
  background:var(--line-soft); color:var(--text-dim); white-space:nowrap;
}

/* Дисциплина кодируется бейджем, а не полосой: полоса уже занята статусом.
   Два смысла в одном визуальном канале здесь ловили дважды. */
.row--stage .cell-name{padding-left:48px}
.row--stage .title{font-size:12px; color:var(--text-dim)}
/* Серый — стадия без компонента: дисциплина неизвестна. Заметно, но не
   кричит, и белый текст остаётся читаемым (на `--line-soft` он пропадал).
   Селектор по `[data-stage]`, а не по `.row--stage`: бездомная стадия
   рисуется ярусом стори, но дисциплину сохраняет. */
.row[data-stage] .gtype{color:#fff; background:var(--c-new)}
.row[data-stage="Дизайн"] .gtype{background:var(--c-design)}
.row[data-stage="Аналитика"] .gtype{background:var(--c-analysis)}
.row[data-stage="Бэкенд"] .gtype{background:var(--c-back)}
.row[data-stage="Фронтенд"] .gtype{background:var(--c-front)}
.row--stage .bar{height:14px; border-radius:3px}
.row--stage .point{width:11px; height:11px}
.row--stage .bar-label{font-size:11px}
/* Бейдж типа НЕ приглушается у закрытых: тип — это структура,
   а не статус. Смешивать два смысла в одном элементе уже ловили. */

/* Шрифт кодирует ТОЛЬКО уровень иерархии: эпик жирный и тёмный всегда,
   независимо от статуса. Статус живёт в цвете полосы — смешивать два
   смысла в одном визуальном канале нельзя, список начинает рябить.
   Приглушение делаем цветом, а не opacity: полупрозрачная ячейка
   пропускает фоновую сетку, и под текстом появляется грязь. */
.row.closed .key,
.row.closed .pill{color:var(--text-dim)}
.row.closed .bar{opacity:.5}

.pill{
  flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:9px;
  border:1px solid var(--line); color:var(--text-dim); white-space:nowrap;
}
.pill--urgent{border-color:var(--c-urgent); color:var(--c-urgent); font-weight:600}
.pill--warn{border-color:var(--c-urgent); color:var(--c-urgent)}
/* Счётчик листьев стадии. Цвет появляется только на «все сделаны»:
   постоянная раскраска на десятках стадий рябит. */
.pill--leaves{font-variant-numeric:tabular-nums}
.pill--leaves.all-done{border-color:var(--c-done); color:var(--c-done)}

/* ── Полосы ───────────────────────────────────────────── */
.bar{
  position:absolute; top:50%; transform:translateY(-50%);
  height:22px; min-width:3px; border-radius:4px; background:var(--c-new);
  cursor:default;
  display:flex; align-items:center; overflow:hidden;
}
.row--epic .bar{height:34px; border-radius:7px}
.row--story .bar{height:26px; border-radius:5px}
/* Эпик — самая массивная полоса: шаг высоты 14/26/34 по ярусам плюс обводка
   в тон темнее заливки. Смесь с --text даёт видимый контур в обеих темах. */
.row--epic .bar.g-planned{border:2px solid color-mix(in srgb, var(--c-planned) 55%, var(--text))}
.row--epic .bar.g-inProgress{border:2px solid color-mix(in srgb, var(--c-progress) 55%, var(--text))}
.row--epic .bar.g-done{border:2px solid color-mix(in srgb, var(--c-done) 55%, var(--text))}
.bar.g-planned{background:var(--c-planned)}
.bar.g-planned .bar-label{color:var(--c-planned-label)}
.bar.g-inProgress{background:var(--c-progress)}
.bar.g-done{background:var(--c-done)}
/* Беклог — пустой контур: работы ещё нет, заливка выглядела бы обещанием. */
.bar.g-new{
  background:color-mix(in srgb, var(--text) 4%, transparent);
  border:2px dashed color-mix(in srgb, var(--text) 55%, var(--surface));
}
.bar.g-new .bar-label{color:var(--text)}
.bar.clipped{border-radius:3px 0 0 3px}

/* Факт — контур поверх плана, и только там, где он с планом разошёлся.
   Полоска внутри читалась как второе тёмное пятно в каждой строке: у большей
   части карточек факт совпадает с планом, и сказать ей было нечего.
   Контур обрамляет заливку, а не соперничает с ней, и появляется редко —
   поэтому означает «здесь есть о чём спросить».
   Мышь ловит именно он: вопрос вызывает расхождение, а не сама полоса —
   что за задача, видно в колонке слева без всякой подсказки. */
.bar-fact{
  position:absolute; top:50%; transform:translateY(-50%);
  height:30px; min-width:4px; border-radius:6px;
  border:1.5px solid var(--text-dim);
  cursor:help;
}
.row--epic .bar-fact{height:42px; border-radius:9px}
.row--story .bar-fact{height:34px; border-radius:7px}
.row--stage .bar-fact{height:20px; border-radius:4px}
/* Работа переехала дедлайн — контур тревожный целиком. Начали раньше срока
   беды нет, там достаточно нейтральной обводки. */
.bar-fact.late{border-color:var(--c-urgent)}

/* Цвет полосы кодирует статус, светлота убывает вниз по иерархии:
   эпик — полный тон, стори — 90%, стадия — 78%. Плюс высота 34/26/14
   и обводка эпика: три яруса читаются без легенды. */
.row--story .bar.g-new{background:transparent}
.row--story .bar.g-planned{background:color-mix(in srgb, var(--c-planned) 90%, var(--surface))}
.row--story .bar.g-inProgress{background:color-mix(in srgb, var(--c-progress) 90%, var(--surface))}
.row--story .bar.g-done{background:color-mix(in srgb, var(--c-done) 90%, var(--surface))}
.row--stage .bar.g-planned{background:color-mix(in srgb, var(--c-planned) 78%, var(--surface))}
.row--stage .bar.g-inProgress{background:color-mix(in srgb, var(--c-progress) 78%, var(--surface))}
.row--stage .bar.g-done{background:color-mix(in srgb, var(--c-done) 78%, var(--surface))}

/* Плана на карточке нет, полоса нарисована по работе детей. Штриховка
   поверх заливки: строку видно, но обещанием срока она не выглядит.
   Идёт ПОСЛЕ правил тона и с той же специфичностью: `background` выше —
   сокращённое свойство, и объявленный раньше `background-image` оно
   обнуляет молча. Ровно так штриховка и пропала в первый раз. */
.row--epic .bar.no-plan,
.row--story .bar.no-plan,
.row--stage .bar.no-plan{
  background-image:repeating-linear-gradient(
    -45deg,
    rgb(255 255 255 / .38) 0 3px,
    transparent 3px 7px
  );
}

/* Название внутри полосы — дубль колонки слева, и это намеренно: на широкой
   полосе глаз читает подпись там, где смотрит на срок. Узкая полоса просто
   обрежет текст, колонка остаётся единственным надёжным источником имени. */
.bar-label{
  padding:0 8px; font-size:11px; line-height:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  color:#fff; font-weight:500; pointer-events:none;
}
.row--epic .bar-label{font-weight:600}
.bar.broken .bar-label{color:#fff}
.bar.broken{background:repeating-linear-gradient(45deg,var(--c-urgent),var(--c-urgent) 4px,transparent 4px,transparent 8px)}

/* Одна дата из двух — ромб на известной дате. Форма намеренно другая:
   полоса означала бы придуманную длительность. */
.point{
  position:absolute; top:50%; width:15px; height:15px;
  margin-left:-7px; transform:translateY(-50%) rotate(45deg);
  left:calc(var(--from) * var(--day-px));
  background:var(--surface); border:2px solid var(--c-new);
}
.point.g-planned{border-color:var(--c-planned)}
.point.g-inProgress{border-color:var(--c-progress)}
.point.g-done{border-color:var(--c-done)}
.row.closed .point{opacity:.5}

/* ── Секции ───────────────────────────────────────────── */
/* Фон и ширина в размер колонки имён обязательны: заголовок липнет влево,
   а фоновая сетка при горизонтальной прокрутке уезжает под него — прозрачный
   заголовок пропускал бы полосы выходных прямо в зону названий. */
.section{
  display:flex; align-items:center; gap:8px;
  position:sticky; left:0; width:max-content; min-width:var(--name-w);
  padding:16px 12px 6px;
  border:0; background:var(--surface); cursor:pointer;
  font:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-dim);
}
.section:hover{color:var(--text)}
.section::before{content:"▶"; font-size:9px; transition:transform .12s}
.section[aria-expanded="true"]::before{transform:rotate(90deg)}
.section--static{cursor:default}
.section--static::before{content:none}

.hide-done .grp.closed,
.hide-done .row--story.closed{display:none}

/* Поиск: показываем совпавшие строки и их предков. Без предков найденная
   стадия висит в воздухе — не видно, к какой стори и какому эпику она
   относится, а ради этого Гант и открывают. */
.filtering .row{display:none}
.filtering .row.match,
.filtering .row.on-path{display:flex}
.filtering .section{display:none}
.filtering .kids{display:block !important}
/* Предок показан ради контекста, а не потому что подошёл под запрос.
   Без этой разницы находка и путь к ней читаются одним списком. */
.filtering .row.on-path{opacity:.45}

/* Маркер: подсвечен ровно тот фрагмент, из-за которого строка нашлась. */
mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
/* Совпадение по бейджу — сам бейдж и обводим: у стадии «[Design] Поддержка»
   слова из запроса в названии нет вовсе, подсвечивать там нечего. */
.gtype.mark-on,
.tdisc.mark-on{outline:2px solid var(--mark-line); outline-offset:1px}

/* ── Тултип ───────────────────────────────────────────── */
#tip{
  position:fixed; z-index:100; max-width:420px; display:none;
  padding:8px 10px; border-radius:6px;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:0 6px 20px rgb(0 0 0 / .16);
  font-size:12px; line-height:1.45; pointer-events:none;
}
#tip b{display:block; margin-bottom:3px; font-weight:600}
#tip dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:1px 10px; color:var(--text-dim)}
#tip dd{margin:0; color:var(--text)}

/* Закреплённая подсказка принимает мышь — иначе до ссылок не дойти. */
#tip.pinned{pointer-events:auto; max-width:560px}

#tip .tip-sub{margin:7px 0 3px; padding-top:6px; border-top:1px solid var(--line-soft); font-size:11px; color:var(--text-dim)}
#tip .tip-kid{
  display:grid; grid-template-columns:auto auto auto 1fr; align-items:baseline;
  gap:0 8px; padding:1px 0; white-space:nowrap;
}
#tip .tip-kid-type{font-size:10px; color:var(--text-dim)}
#tip .tip-kid-dates{color:var(--text); font-variant-numeric:tabular-nums}
#tip .tip-kid-name{
  grid-column:1 / -1; padding-left:2px;
  color:var(--text-dim); font-size:11px;
  overflow:hidden; text-overflow:ellipsis;
}
#tip .tip-edge{
  justify-self:start;
  font-size:10px; padding:0 5px; border-radius:8px;
  border:1px solid var(--c-progress); color:var(--c-progress);
}
#tip .tip-more,
#tip .tip-hint{margin-top:4px; font-size:10px; color:var(--text-dim)}

.empty-note{padding:40px 20px; color:var(--text-dim); text-align:center}

/* ── Вид «Проблемы» ───────────────────────────────────── */
#problems{overflow:auto; min-height:0; padding:4px 20px 24px; background:var(--surface)}
body[data-view="problems"] #gantt{display:none}
body[data-view="problems"] .gantt-only{display:none}
body[data-view="gantt"] #problems{display:none}

.prob{max-width:1100px; margin:22px 0 0}
.prob h2{
  margin:0 0 2px; font-size:13px; font-weight:600;
  display:flex; align-items:baseline; gap:8px;
}
.prob .count{
  font-size:11px; font-weight:500; color:var(--text-dim);
  border:1px solid var(--line); border-radius:9px; padding:1px 7px;
}
.prob .hint{margin:0 0 8px; font-size:12px; color:var(--text-dim)}
.prob ul{margin:0; padding:0; list-style:none; border-top:1px solid var(--line-soft)}
.prob li{
  display:flex; align-items:baseline; gap:10px;
  padding:5px 2px; border-bottom:1px solid var(--line-soft);
}
.prob li .key{flex:0 0 66px}
.prob li .name{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prob li .side{flex:0 0 auto; font-size:11px; color:var(--text-dim)}
.prob--urgent h2{color:var(--c-urgent)}
.prob--urgent .count{border-color:var(--c-urgent); color:var(--c-urgent)}
.prob-clean{padding:60px 20px; text-align:center; color:var(--text-dim)}

.diff{
  max-width:1100px; margin:18px 0 0; padding:10px 14px;
  border:1px solid var(--line); border-radius:8px; background:var(--bg);
  font-size:12px;
}
.diff b{font-size:13px}
.diff ul{margin:6px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:4px 14px}
.diff li{display:flex; gap:6px; align-items:baseline}
.diff .gone{color:var(--c-done); font-weight:600}
.diff .came{color:var(--c-urgent); font-weight:600}
.diff .since{color:var(--text-dim)}

/* ── Вид «Дерево» ─────────────────────────────────────── */
#tree{overflow:auto; min-height:0; background:var(--surface)}
body[data-view="tree"] #gantt,
body[data-view="tree"] #problems,
body[data-view="tree"] .gantt-only{display:none}
body[data-view="gantt"] #tree,
body[data-view="problems"] #tree{display:none}
body:not([data-view="tree"]) .tree-only{display:none}
/* Масштаб общий для Ганта и дерева — обе шкалы живут на --day-px. */
body[data-view="problems"] .chart-only{display:none}

/* Дерево отвечает на «как устроено», Гант — на «когда». Полос здесь нет
   намеренно: два похожих таймлайна хуже, чем один. */
.trow{
  display:flex; align-items:center; gap:8px;
  padding:3px 16px 3px calc(16px + var(--lvl) * var(--tstep));
  border-bottom:1px solid var(--line-soft);
  min-height:28px; position:relative;
}
/* Эпик — граница блока, а не просто строка: лёгкая заливка отбивает
   один эпик от другого лучше, чем отступ. Идёт до :hover, чтобы наведение
   всё равно читалось. */
.trow.is-epic{background:var(--band)}
.trow:hover{background:var(--hover)}

/* Соединители ветки: вертикаль от родителя плюс усик к строке ребёнка.
   У последнего ребёнка вертикаль обрывается на его строке — видно, где
   ветка кончилась, а не тянется вслепую до низа поддерева. */
.tkids{position:relative}
.tkids > .tnode{position:relative}
.tkids > .tnode::before{
  content:""; position:absolute; z-index:0;
  left:calc(24px + (var(--lvl) - 1) * var(--tstep));
  top:0; bottom:0; width:1px; background:var(--line);
}
.tkids > .tnode:last-child::before{bottom:auto; height:14px}
.tkids > .tnode > .trow::after{
  content:""; position:absolute; z-index:0;
  left:calc(24px + (var(--lvl) - 1) * var(--tstep));
  top:14px; width:13px; height:1px; background:var(--line);
}

.ttw{
  flex:0 0 16px; width:16px; height:16px; padding:0;
  display:grid; place-items:center;
  border:0; border-radius:3px; background:transparent; cursor:pointer;
  color:var(--text-dim); font-size:9px; line-height:1;
}
.ttw:hover{background:var(--line-soft); color:var(--text)}
.ttw::before{content:"▶"; transition:transform .12s}
.ttw[aria-expanded="true"]::before{transform:rotate(90deg)}
.ttw-gap{flex:0 0 16px}

/* Цвет = статус, заливка = начата ли работа. Пустой кружок для беклога
   отличается от залитого даже в оттенках серого и на скриншоте. */
.tdot{
  flex:0 0 9px; width:9px; height:9px; border-radius:50%;
  background:transparent; border:1.5px solid var(--c-new);
}
.tdot.g-planned{background:var(--c-planned); border-color:var(--c-planned)}
.tdot.g-inProgress{background:var(--c-progress); border-color:var(--c-progress)}
.tdot.g-done{background:var(--c-done); border-color:var(--c-done)}
.tdot.g-cancelled{background:transparent; border-color:var(--c-new); border-style:dashed}

.ttype{
  flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:4px;
  background:var(--line-soft); color:var(--text-dim); white-space:nowrap;
}
/* Бейдж типа кодирует ярус схемы: Эпик → История → Стадия → Задача.
   Четыре разных вида заливки — заливка, светлая заливка, обводка, серый
   фон — читаются с одного взгляда и не требуют считать отступы. */
.trow.is-epic .ttype{background:var(--c-progress); color:#fff}
.trow.is-epic .tname{font-weight:600}
.trow.is-story .ttype{background:color-mix(in srgb, var(--c-progress) 22%, var(--surface)); color:var(--c-progress)}
.trow.is-story .tname{font-weight:500}
.trow.is-stage .ttype{
  background:transparent; color:var(--text-dim);
  border:1px solid var(--line); padding:0 5px;
}
.trow.is-stage .tname{font-weight:500}

/* Дисциплина — отдельный бейдж, а не заливка `ttype`: тип кодирует ярус
   схемы, и второй смысл в том же элементе уже дважды давал рябь. Цвета те
   же, что у стадий на Ганте, — виды обязаны читаться одинаково. */
.tdisc{
  flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:4px;
  color:#fff; background:var(--c-new); white-space:nowrap;
}
.tdisc[data-stage="Дизайн"]{background:var(--c-design)}
.tdisc[data-stage="Аналитика"]{background:var(--c-analysis)}
.tdisc[data-stage="Бэкенд"]{background:var(--c-back)}
.tdisc[data-stage="Фронтенд"]{background:var(--c-front)}

.tname{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.trow.closed .tname,
.trow.closed .key{color:var(--text-dim)}
.tinside{
  flex:0 0 auto; font-size:10px; padding:1px 6px; border-radius:9px;
  border:1px solid var(--c-progress); color:var(--c-progress); white-space:nowrap;
}
.tdates,.tstatus,.tass{flex:0 0 auto; font-size:11px; color:var(--text-dim); white-space:nowrap}
.tdates{font-variant-numeric:tabular-nums}
.tstatus{min-width:112px; text-align:right}
.tass{min-width:126px; text-align:right; overflow:hidden; text-overflow:ellipsis}

.tsection{
  position:sticky; left:0; width:max-content; min-width:var(--tname-w);
  display:flex; align-items:center; gap:8px;
  padding:14px 16px 6px;
  border:0; background:var(--surface); cursor:pointer;
  font:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--text-dim);
}
.tsection:hover{color:var(--text)}
.tsection::before{content:"▶"; font-size:9px; transition:transform .12s}
.tsection[aria-expanded="true"]::before{transform:rotate(90deg)}

/* Скрытие завершённых и фильтр по человеку — через классы на body,
   чтобы не перерисовывать 725 строк на каждое переключение. */
.tree-hide-done .tnode.all-closed{display:none}
.tree-filtered .tnode:not(.on-path){display:none}
/* Та же логика, что на Ганте: путь к находке приглушён, находка — нет.
   Гасим только свою строку, не ветку целиком, иначе потомки под совпавшим
   узлом выцвели бы заодно. */
.tree-filtered .tnode.on-path:not(.match) > .trow{opacity:.45}
.tree-note{padding:10px 16px; font-size:12px; color:var(--text-dim)}

/* Фильтр по эпику — общий для Ганта и дерева. */
.epic-filtered #tree .tree-body > .tnode:not(.epic-on),
.epic-filtered #tree .tsection,
.epic-filtered #tree #t-homeless,
.epic-filtered #gantt .grp:not(.epic-on),
.epic-filtered #gantt .section-wrap{display:none}

/* ── Вид «Спринты» ────────────────────────────────────── */
/* Печатный отчёт команды как эталон: снапшот метрик закрытого спринта,
   а не живой пересчёт — Трекер переписывает историю (carry-over
   обнуляется, когда незакрытые задачи переносят в новый спринт), и
   пересчитанный «задним числом» закрытый спринт был бы лживым. */
#sprints{overflow:auto; min-height:0; padding:4px 20px 32px; background:var(--surface)}
body:not([data-view="sprints"]) #sprints{display:none}
body[data-view="sprints"] #gantt,
body[data-view="sprints"] #problems,
body[data-view="sprints"] #tree,
body[data-view="sprints"] .gantt-only,
body[data-view="sprints"] .chart-only{display:none}

.spr-summary{max-width:1100px; margin:22px 0 0}
.spr-summary h2{margin:0 0 10px; font-size:13px; font-weight:600}
.spr-empty{margin:0; font-size:12px; color:var(--text-dim)}

.spr-history{width:100%; border-collapse:collapse; font-size:12px}
.spr-history th,.spr-history td{
  padding:6px 10px; text-align:left; border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums;
}
.spr-history th{
  font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:500;
  color:var(--text-dim); border-bottom:1px solid var(--line);
}
/* Таблица «Качество данных» живого блока — та же сетка, что у истории
   спринтов, но без шапки: три колонки читаются как «показатель · сколько ·
   почему это важно», и подписывать их сверху нечем. Ни одно правило
   .spr-history шапки не требует, поэтому свой класс нужен ровно для двух
   мелочей: не рвать название показателя переносом и приглушить пояснение,
   чтобы оно не спорило с цифрой рядом. */
.spr-quality td:first-child{white-space:nowrap}
.spr-quality td:last-child{color:var(--text-dim)}

/* Велосити-чарт стоит между заголовком сводки и таблицей истории, поэтому
   отступ ему нужен только снизу: сверху уже отбивает margin у .spr-summary h2.
   Прокрутку по горизонтали и легенду даёт общий с burn-down .spr-chart. */
.spr-velo{margin:0 0 18px}

/* Живой блок текущего спринта — единственная часть вкладки, которую
   страница показывает по свежему расчёту, а не по снапшоту: идущий
   спринт Трекер ещё не переписал (см. compute_live_sprint в build.py).
   Плитки лежат на сетке с зазором в 1px: зазор красит --line и сам
   работает разделителем, поэтому рамок у плиток нет. */
.spr-live{max-width:1100px; margin:22px 0 28px}
.spr-live h2{margin:0; font-size:15px; font-weight:600}
.spr-kpis{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px; margin:12px 0 18px;
  background:var(--line); border:1px solid var(--line);
  border-radius:10px; overflow:hidden;
}
/* Не .spr-kpi: это имя занято KPI-строкой карточки закрытого спринта
   (display:flex ниже) — общий класс сложил бы её в колонку. */
.spr-kpi-tile{background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:2px}
.spr-kpi-tile .n{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.spr-kpi-tile .k{font-size:12px; color:var(--text-dim)}
/* Третья строка плитки — расшифровка числа («из чего оно сложилось»).
   Нужна пока только сводке Ганта, но живёт у общего класса: подпись
   к KPI — свойство плитки, а не конкретной вкладки. */
.spr-kpi-tile .s{font-size:10px; color:var(--text-dim)}

.spr-chart{overflow-x:auto}
/* Легенда чарта переиспользует .legend/.swatch из тулбара, где легенда
   прижата вправо (margin-left:auto) — под заголовком она должна стоять
   по левому краю. Плашки тоньше: здесь они изображают линии, не заливки. */
.spr-chart-legend{margin:0 0 6px; font-size:11px}
.spr-chart-legend .swatch{height:3px}

/* Карточка спринта — печатный аналог: рамка отбивает один спринт от
   другого так же, как в бумажном отчёте это делал бы разрыв страницы. */
.spr-card{
  max-width:1100px; margin:22px 0 0; padding:20px 24px 22px;
  border:1px solid var(--line); border-radius:12px; background:var(--bg);
}
.spr-card-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap}
.spr-card-head h2{margin:0; font-size:15px; font-weight:600}
.spr-dates{margin-top:2px; font-size:12px; color:var(--text-dim)}
.spr-note{font-size:11px; font-style:italic; color:var(--text-dim); text-align:right; max-width:320px}

.spr-kpi{
  display:flex; margin:18px 0 4px;
  border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
}
.spr-kpi-item{flex:1 1 0; padding:12px 10px; text-align:center; border-left:1px solid var(--line-soft)}
.spr-kpi-item:first-child{border-left:0}
.spr-kpi-num{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.spr-kpi-label{margin-top:2px; font-size:11px; color:var(--text-dim)}
.spr-kpi-sub{margin-top:2px; font-size:10px; color:var(--text-dim)}

.spr-section{margin-top:20px}
.spr-section h3{margin:0 0 10px; font-size:12px; font-weight:600; color:var(--text-dim)}

.spr-bars{display:flex; flex-direction:column; gap:7px}
.spr-bar-row{display:flex; align-items:center; gap:10px}
.spr-bar-name{
  flex:0 0 170px; font-size:12px; color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.spr-bar-track{flex:1 1 auto; height:14px; border-radius:3px; background:var(--line-soft); overflow:hidden}
/* display:block обязателен: разметка полосы собрана из span'ов (см.
   sprBarRow), а инлайновый элемент высоту в процентах игнорирует —
   заливка схлопнулась бы в ноль. */
.spr-bar-fill{display:block; height:100%; border-radius:3px}
.spr-bar-val{flex:0 0 auto; font-size:11px; color:var(--text-dim); white-space:nowrap}

/* Строка исполнителя живого спринта — раскрывашка на нативном <details>:
   клавиатуру, Enter/Space и объявление «свёрнуто/развёрнуто» даёт браузер,
   свой aria-expanded и обработчик клавиш не нужны. Полоса лежит в <summary>
   (то есть внутри кнопки), ссылки на задачи — в теле <details>, снаружи:
   вложенного интерактива так не возникает. */
.spr-asg summary{
  display:flex; align-items:center; gap:8px;
  list-style:none; cursor:pointer; border-radius:4px;
}
/* Свой маркер вместо браузерного: дефолтный треугольник ломает выравнивание
   полосы и в Safari рисуется отдельным ::-webkit-details-marker. */
.spr-asg summary::-webkit-details-marker{display:none}
.spr-asg summary:hover .spr-asg-caret{color:var(--text)}
.spr-asg summary:focus-visible{outline:2px solid var(--c-progress); outline-offset:2px}
.spr-asg summary .spr-bar-row{flex:1 1 auto; min-width:0}
.spr-asg-caret{flex:0 0 auto; font-size:9px; color:var(--text-dim); transition:transform .12s}
.spr-asg[open] .spr-asg-caret{transform:rotate(90deg)}

/* Тело раскрывашки отбито слева ровно на ширину карета с зазором — список
   задач читается как продолжение своей строки, а не как новая секция. */
.spr-asg-body{margin:6px 0 10px 17px}
.spr-asg-filter{font-size:11px; color:var(--c-progress); text-decoration:none}
.spr-asg-filter:hover{text-decoration:underline}
.spr-asg-list{margin:4px 0 0; padding:0; list-style:none}
.spr-asg-list li{
  display:flex; align-items:baseline; gap:8px;
  padding:3px 0; border-top:1px solid var(--line-soft);
}
.spr-asg-list .key{flex:0 0 66px}
.spr-asg-name{flex:1 1 auto; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spr-asg-status{flex:0 0 auto; font-size:11px; color:var(--text-dim); white-space:nowrap}
/* Закрытая задача гасится целиком, а не зачёркивается: зачёркивание на этой
   вкладке нигде не значит «готово», а --text-dim уже несёт смысл «фон, не
   требует внимания» — им же приглушены все вторичные подписи инструмента. */
.spr-asg-list li.done .spr-asg-name{color:var(--text-dim)}

/* ── Cycle time ───────────────────────────────────────── */
/* Плитка, встающая на место двух цифр цикла, когда истории статусов нет.
   Занимает их место целиком: пустой ряд читался бы как «метрику не
   завезли», а не как «данные не доехали». */
.spr-kpi-tile--wide{grid-column:span 2; justify-content:center}

/* Подпись под рядом плиток. Отрицательный отступ подтягивает её к ряду:
   у .spr-kpis снизу 18px, и без этого подпись читалась бы отдельной
   строкой, а не расшифровкой соседних цифр. */
.spr-kpis-note{margin:-10px 0 18px; font-size:11px; color:var(--text-dim)}
/* Строка о неполных данных и о несходе расчёта. Тревожный токен, а не
   приглушённый: обе говорят «показанному верить не полностью», и потерять
   их среди подписей нельзя. */
.spr-cycle-warn{color:var(--c-urgent)}
/* Внутри плитки нужна пара классов: у `.spr-kpi-tile .k` специфичность
   выше одиночного класса, и без этого правила подпись отказа осталась бы
   приглушённой наравне с обычными — то есть неотличимой от нормы. */
.spr-kpi-tile .k.spr-cycle-warn{color:var(--c-urgent)}
/* Подписей под рядом плиток бывает до трёх (расшифровка, неполные данные,
   несход расчёта). Отрицательный отступ подтягивает к ряду только первую —
   иначе вторая наезжала бы на неё. */
.spr-kpis-note + .spr-kpis-note{margin-top:-14px}

/* Фильтр отделов — тот же .seg, что переключает виды в шапке: второго
   языка для «выбери одно из» на странице заводить незачем. */
.spr-filters{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 16px}
.spr-filters .seg{flex-wrap:wrap}
.spr-filters-label{font-size:12px; color:var(--text-dim)}

/* Легенда «Где висит» — .legend/.swatch из тулбара, но прижата влево:
   там её уводит вправо margin-left:auto. */
.spr-stage-legend{margin:0 0 10px 0; font-size:11px}

/* Строка статуса — раскрывашка на нативном <details>, ровно как строка
   исполнителя выше: свёрнутая это полоса, развёрнутая — пять самых долгих
   задач. Полоса лежит в <summary>, ссылки на задачи — в теле, снаружи:
   вложенного интерактива не возникает. */
.spr-stage summary{
  display:flex; align-items:center; gap:8px;
  list-style:none; cursor:pointer; border-radius:4px;
}
.spr-stage summary::-webkit-details-marker{display:none}
.spr-stage summary:hover{background:var(--hover)}
.spr-stage summary:hover .spr-stage-caret{color:var(--text)}
.spr-stage summary:focus-visible{outline:2px solid var(--c-progress); outline-offset:2px}
.spr-stage summary .spr-bar-row{flex:1 1 auto; min-width:0}
.spr-stage-caret{flex:0 0 auto; font-size:9px; color:var(--text-dim); transition:transform .12s}
.spr-stage[open] .spr-stage-caret{transform:rotate(90deg)}
.spr-stage-body{margin:4px 0 8px 17px}

/* Мини-полоса «где висела задача» в строке раскрывашки исполнителя: доли
   времени по статусам. Ширина фиксирована — иначе колонка цикла справа
   гуляла бы от строки к строке. Дорожка видна и пустой: у задачи, не
   дошедшей до «В работе», делить нечего, и пустой стек честно это
   показывает. align-self обязателен — строка выровнена по baseline, а у
   полосы без текста базовой линии нет, и она провалилась бы вниз. */
.spr-asg-stack{
  flex:0 0 108px; align-self:center;
  display:flex; height:9px; border-radius:3px;
  overflow:hidden; background:var(--line-soft);
}
.spr-asg-stack span{display:block; height:100%}
.spr-asg-cycle{
  flex:0 0 74px; text-align:right; white-space:nowrap;
  font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums;
}
/* Идущий цикл — не итог, а «пока»: тот же тёплый токен, каким на Ганте
   помечена аналитика. Закрытый цикл остаётся приглушённым: он факт,
   внимания не требует. */
.spr-asg-cycle.running{color:var(--c-analysis)}

/* Калькулятор capacity живого блока. Строка ползунка — та же .spr-bar-row,
   что у бар-чартов выше (подпись 170px · тянущаяся середина · значение
   справа), поэтому свой класс добавляет ровно то, чего у полос нет.
   Сама строка — <label>: клик по названию попадает в ползунок. */
.spr-calc-row{cursor:pointer}
/* min-width:0 обязателен: у range собственная внутренняя ширина, и без
   обнуления минимума flex его не сжимает — ползунок выдавливает значение
   за правый край строки. accent-color — тот же --c-progress, которым
   покрашен весь интерактив инструмента: активная кнопка вида, галка
   мультивыбора, фокусные обводки. */
.spr-calc-range{
  flex:1 1 auto; min-width:0; margin:0;
  accent-color:var(--c-progress); cursor:pointer;
}
.spr-calc-range:focus-visible{outline:2px solid var(--c-progress); outline-offset:2px}
/* Колонка значения фиксированной ширины: у .spr-bar-val ширина по
   содержимому, и «8» → «14» дёргало бы строку при каждом перетаскивании. */
.spr-calc-val{
  flex:0 0 46px; text-align:right;
  font-size:12px; color:var(--text); font-variant-numeric:tabular-nums;
}
.spr-calc-note{margin:10px 0 0; font-size:11px; color:var(--text-dim)}

.spr-commit-track{
  position:relative; height:22px; border-radius:5px; overflow:hidden;
  border:1px solid var(--line); background:var(--surface);
}
/* Серая, а не «в работе»: velocity здесь не про статус, а про факт —
   var(--c-progress) уже занят другим смыслом на Ганте и в Дереве. */
.spr-commit-fill{height:100%; background:var(--c-new)}
.spr-commit-labels{display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:var(--text-dim)}

.spr-footnote{margin-top:20px; padding-top:10px; border-top:1px solid var(--line-soft); font-size:10px; color:var(--text-dim)}

@media print{
  :root{--day-px:1.6px; --name-w:250px}
  body{height:auto; display:block}
  #gantt{overflow:visible; max-height:none}
  .row{break-inside:avoid}
  /* .spr-filters целиком, а не только его .seg: на бумаге от фильтра
     остались бы слово «Отдел» и пустота там, где были кнопки. */
  .bands,.controls,.seg,.search,.icon-btn,.spr-filters{display:none}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}

  /* «Спринты»: карточка на страницу, шапка инструмента и остальные виды
     на бумаге не нужны — печатают один отчёт, а не весь инструмент. */
  body[data-view="sprints"] header.toolbar{display:none}
  body[data-view="sprints"] #sprints{overflow:visible; padding:0}
  .spr-live{break-inside:avoid; break-after:page}
  .spr-summary{break-after:page}
  .spr-card{break-inside:avoid; break-after:page}
  .spr-card:last-child{break-after:auto}
}
@page{size:landscape}
</style>

<script>
(function(){
"use strict";

const DATA = JSON.parse(document.getElementById("gantt-data").textContent);
const NODES = DATA.nodes, META = DATA.meta, TL = META.timeline;
const SPRINTS = DATA.sprints || [];
const TOTAL_DAYS = TL.to - TL.from + 1;
const MS_DAY = 86400000;
const MONTHS = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
/* Неделя заметно уже дня: на 26px они различались только подписью шкалы,
   а плотность полос была почти одинаковой — переключатель терял смысл.
   Месяц убран совсем: при 4.5px на день полосы вырождались в штрихи. */
const SCALES = { day: 32, week: 17 };
const SCALE_ITEMS = [
  { value: "day", label: "День" },
  { value: "week", label: "Неделя" },
];
const WEEKDAYS = ["вс","пн","вт","ср","чт","пт","сб"];

/** Третий ярус схемы: стадия отдела внутри истории. Не тип работы вообще,
 *  а именно контейнер этапа — «Ошибка» и «Рефакторинг» сюда не входят,
 *  они листья. Какая это дисциплина, говорит компонент карточки (`discipline`),
 *  а не тип: типом все стадии одинаковы. */
const STAGE_TYPE = "Стадия";

const root = document.documentElement;
const gantt = document.getElementById("gantt");
const tip = document.getElementById("tip");

let scale = "week";
let scaleDropdown = null;

root.style.setProperty("--total-d", TOTAL_DAYS);

/** Номер дня от 1970-01-01. Тот же счёт, что в build.py. */
function dayNumber(d){
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / MS_DAY);
}
function dayToText(dayNo){
  const d = new Date(dayNo * MS_DAY);
  return String(d.getUTCDate()).padStart(2,"0") + "." + String(d.getUTCMonth()+1).padStart(2,"0") + "." + d.getUTCFullYear();
}
function dayPx(){ return SCALES[scale]; }

/** «Сегодня» считается при открытии, а не на сборке: файл живёт на диске
 *  неделями, и вшитая дата генерации молча соврала бы. */
const TODAY = dayNumber(new Date());
root.style.setProperty("--today-d", Math.max(0, TODAY - TL.from));

function el(tag, cls, text){
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

/** Ставит позицию элемента в днях. Пиксели считает CSS из --day-px. */
function place(node, fromDay, lengthDays){
  node.style.setProperty("--from", Math.max(0, fromDay - TL.from));
  node.style.setProperty("--len", Math.max(1, lengthDays));
  return node;
}

/* ── Шкала ──────────────────────────────────────────── */
function renderScale(){
  const scaleBox = document.getElementById("scale");
  const bands = document.getElementById("bands");
  scaleBox.textContent = "";
  bands.textContent = "";

  const start = new Date(TL.from * MS_DAY);
  let cursor = Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1) / MS_DAY;
  let index = 0;

  while (cursor <= TL.to){
    const d = new Date(cursor * MS_DAY);
    const next = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1) / MS_DAY;
    const from = Math.max(cursor, TL.from);
    const len = Math.min(next, TL.to + 1) - from;
    const isQuarter = d.getUTCMonth() % 3 === 0;

    const label = place(el("div", "month" + (isQuarter ? " q" : "")), from, len);
    label.textContent = len * dayPx() > 26
      ? MONTHS[d.getUTCMonth()] + (isQuarter ? " " + String(d.getUTCFullYear()).slice(2) : "")
      : "";
    scaleBox.appendChild(label);

    cursor = next;
    index++;
  }

  if (scale === "day"){
    for (let day = TL.from; day <= TL.to; day++){
      const dt = new Date(day * MS_DAY);
      const wd = dt.getUTCDay();
      const cell = place(el("div", "day-cell"), day, 1);
      if (wd === 0 || wd === 6) cell.classList.add("off");
      if (wd === 1) cell.classList.add("mon");
      if (day === TODAY) cell.classList.add("now");
      cell.appendChild(el("b", null, String(dt.getUTCDate()).padStart(2, "0")));
      cell.appendChild(el("i", null, WEEKDAYS[wd]));
      scaleBox.appendChild(cell);

      if (wd === 6) bands.appendChild(place(el("div", "weekend"), day, 2));
    }
  }

  if (scale === "week"){
    // Понедельник: 1970-01-01 был четвергом, значит понедельник — это day % 7 === 4.
    // Сдвиг +3 обнуляет остаток ровно в понедельник и, в отличие от -4, не уходит
    // в минус: в JS остаток от отрицательного числа отрицателен.
    let week = TL.from - ((TL.from + 3) % 7);
    while (week <= TL.to){
      const from = Math.max(week, TL.from);
      const len = Math.min(week + 7, TL.to + 1) - from;
      if (len > 0){
        const cell = place(el("div", "week"), from, len);
        cell.textContent = len * dayPx() > 30 ? dayToText(week).slice(0, 5) : "";
        document.getElementById("scale").appendChild(cell);

        const satFrom = week + 5;
        if (satFrom <= TL.to){
          bands.appendChild(place(el("div", "weekend"), Math.max(satFrom, TL.from), 2));
        }
      }
      week += 7;
    }
  }

  if (TODAY >= TL.from && TODAY <= TL.to) bands.appendChild(el("div", "today"));
}

/* ── Индекс поиска ──────────────────────────────────── */

/** Текст, по которому ищет поиск. Одно правило на оба вида: Гант и Дерево
 *  держат разные наборы полей, но искать обязаны одинаково.
 *
 *  Дисциплина живёт в компоненте карточки, а не в её типе — типы
 *  «Дизайн»/«Аналитика»/«Разработка» из очереди удалены. Без компонентов
 *  запрос «аналитика» не находил ни одной стадии аналитики.
 *
 *  `discipline` в индекс не берём: это первый элемент `components`,
 *  и вторым полем он просто удваивал слово в каждой строке.
 *
 *  `sprint` не берём тоже, и по другой причине: спринты в MCA названы
 *  перечислением модулей («S05 Сотрудники + Уведомления + Поддержка»),
 *  поэтому запрос про модуль вытаскивал спринт целиком. По «уведомл»
 *  из 14 совпадений 7 приходили именно оттуда — ровно половина выдачи,
 *  причём объяснить их на экране нечем: спринта в строке не видно. */
function searchText(node){
  return [
    node.key, node.summary, node.type,
    (node.components || []).join(" "),
    node.status, node.assignee, node.priority,
  ].filter(Boolean).join(" ").toLowerCase();
}

/** Текущий запрос. Одно поле обслуживает оба вида, поэтому значение
 *  берётся из него, а не передаётся между фильтрами. */
function searchQuery(){
  return document.getElementById("search").value.trim().toLowerCase();
}

/** Оборачивает вхождения запроса в `mark`.
 *
 *  Собираем узлы через DOM, а не склейкой innerHTML: в названиях из Трекера
 *  попадаются «<» и «&», и строковая склейка ломала бы разметку. */
function markMatches(host, text, query){
  if (!host) return;
  const lower = text.toLowerCase();
  let at = query ? lower.indexOf(query) : -1;
  if (at === -1){ host.textContent = text; return; }

  host.textContent = "";
  let from = 0;
  while (at !== -1){
    if (at > from) host.appendChild(document.createTextNode(text.slice(from, at)));
    host.appendChild(el("mark", null, text.slice(at, at + query.length)));
    from = at + query.length;
    at = lower.indexOf(query, from);
  }
  if (from < text.length) host.appendChild(document.createTextNode(text.slice(from)));
}

/** Ячейки со свободным текстом — маркер ставится внутрь, на сам фрагмент. */
const MARK_TEXT = ".title, .tname, .tstatus, .tass";
/** Бейджи — обводятся целиком: подчёркивать «Диз» внутри «Дизайн» незачем,
 *  слово и так короткое. */
const MARK_BADGE = ".gtype, .ttype, .tdisc";

/** Подсвечивает в строке всё, что подошло под запрос: текст названия,
 *  статус, исполнителя, бейджи типа и дисциплины.
 *
 *  Исходный текст берётся прямо из ячейки — подсветку перед этим снимает
 *  `clearMarks`, так что там лежит оригинал. Знать, какое поле в какой
 *  ячейке, не требуется, и виды с разной разметкой обслуживает один код.
 *
 *  Для Дерева передавать нужно `.trow`, а не `.tnode`: узел содержит
 *  потомков, и подсветка ушла бы вглубь ветки. */
function highlightRow(row, query){
  if (!row) return;
  row.querySelectorAll(MARK_TEXT).forEach(function(host){
    markMatches(host, host.textContent, query);
  });
  row.querySelectorAll(MARK_BADGE).forEach(function(badge){
    if (badge.textContent.toLowerCase().indexOf(query) !== -1) badge.classList.add("mark-on");
  });
}

/** Снимает подсветку внутри вида.
 *
 *  Ходим по самим `mark`, а не по всем строкам: в Дереве 787 узлов, и
 *  полный обход на каждый набранный символ уже заметен. */
function clearMarks(root){
  root.querySelectorAll("mark").forEach(function(node){
    const host = node.parentNode;
    // Второй `mark` той же строки к этому моменту уже отцеплен первым
    // схлопыванием — у него нет родителя, и трогать его нечего.
    if (host) host.textContent = host.textContent;
  });
  root.querySelectorAll(".mark-on").forEach(function(node){ node.classList.remove("mark-on"); });
}

/* ── Строки ─────────────────────────────────────────── */
/** Корона эпика — инлайн, чтобы страница осталась офлайновой без ассетов. */
const CROWN_SVG = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 4.5 5 8l3-5 3 5 3.5-3.5V12a1.5 1.5 0 0 1-1.5 1.5H3A1.5 1.5 0 0 1 1.5 12V4.5Z"/></svg>';

function buildRow(node){
  const tier = node.level === 0 ? "epic" : node.level === 2 ? "stage" : "story";
  const row = el("div", "row row--" + tier);
  // Дисциплину несёт сама карточка, а не её место в дереве: стадия без
  // родителя падает в «Без эпика» и рисуется ярусом выше, но остаётся
  // дизайном или бэкендом и обязана краситься так же.
  const isStage = node.type === STAGE_TYPE;
  if (isStage) row.dataset.stage = node.discipline || "";
  if (node.closed) row.classList.add("closed");
  row.dataset.key = node.key;
  row.dataset.search = searchText(node);

  const name = el("div", "cell-name");

  if (node.children.length){
    const btn = el("button", "twisty");
    btn.type = "button";
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-controls", "kids-" + node.key);
    btn.setAttribute("aria-label", "Развернуть " + node.key);
    name.appendChild(btn);
  } else {
    // У пустого эпика кнопки нет вовсе: иначе она обещает раскрытие,
    // которого не произойдёт, и это читается как поломка страницы.
    name.appendChild(el("span", "twisty-spacer"));
  }

  // Корона — только у эпика: ярус остальных строк кодируют размер и отступ.
  if (tier === "epic"){
    const crown = el("span", "tier-crown");
    crown.setAttribute("aria-hidden", "true");
    crown.innerHTML = CROWN_SVG;
    name.appendChild(crown);
  }

  const key = el("a", "key", node.key);
  key.href = "https://tracker.yandex.ru/" + node.key;
  key.target = "_blank";
  key.rel = "noopener";
  name.appendChild(key);
  // Бейдж остался только у стадии и показывает дисциплину: тип у всех
  // стадий один («Стадия»), а ярус эпиков и стори читается из типографики.
  if (isStage) name.appendChild(el("span", "gtype", node.discipline || "Стадия"));
  name.appendChild(el("span", "title", node.summary));

  // Прогресс листьев стадии. Поле есть только у стадий с детьми-задачами —
  // считает build.py по всей очереди (count_leaf_progress).
  if (node.leaves){
    const leaves = el("span", "pill pill--leaves", node.leaves.done + "/" + node.leaves.total);
    if (node.leaves.done === node.leaves.total) leaves.classList.add("all-done");
    leaves.title = "Задачи стадии: сделано " + node.leaves.done + " из " + node.leaves.total;
    name.appendChild(leaves);
  }

  if (!node.bar && !node.point){
    const urgent = node.priority === "Блокер" || node.priority === "Критичный";
    name.appendChild(el("span", "pill" + (urgent ? " pill--urgent" : ""), "нет дат"));
  }
  if (node.point){
    name.appendChild(el("span", "pill",
      node.point.kind === "deadline" ? "только дедлайн" : "только старт"));
  }
  if (node.flags.includes("broken-dates")) name.appendChild(el("span", "pill pill--warn", "даты перепутаны"));
  if (node.flags.includes("parent-outside")) name.appendChild(el("span", "pill", "родитель вне выборки"));
  if (node.flags.includes("clipped-right")) name.appendChild(el("span", "pill", "→ " + node.deadline));

  const track = el("div", "cell-track");
  if (node.bar){
    const from = Math.max(node.bar.from, TL.from);
    const to = Math.min(node.bar.to, TL.to);
    const bar = place(el("div", "bar g-" + node.statusGroup), from, to - from + 1);
    if (node.flags.includes("clipped-right")) bar.classList.add("clipped");
    if (node.flags.includes("broken-dates")) bar.classList.add("broken");
    // Плана нет — полоса нарисована по работе детей и обещанием владельца
    // не является. Отмечаем штриховкой, иначе она врёт как обычный срок.
    if (node.flags.includes("plan-missing")) bar.classList.add("no-plan");
    bar.appendChild(el("span", "bar-label", node.summary));
    track.appendChild(bar);

    // Контур факта — только там, где он разошёлся с планом. Совпал — рисовать
    // нечего: обводка по краям заливки не несёт ни грамма информации.
    if (mismatch(node)){
      const fFrom = Math.max(node.fact.from, TL.from);
      const fTo = Math.min(node.fact.to, TL.to);
      if (fTo >= fFrom){
        const fact = place(el("div", "bar-fact"), fFrom, fTo - fFrom + 1);
        if (node.fact.to > node.bar.to) fact.classList.add("late");
        track.appendChild(fact);
      }
    }
  } else if (node.point){
    const dot = el("div", "point g-" + node.statusGroup);
    dot.style.setProperty("--from", Math.max(0, node.point.day - TL.from));
    track.appendChild(dot);
  }

  row.appendChild(name);
  row.appendChild(track);
  return row;
}

/** Эпик со своими детьми — одной группой, чтобы «скрыть завершённые»
 *  не оставил детей висеть без заголовка. */
function buildGroup(key){
  const node = NODES[key];
  const group = el("div", "grp");
  group.dataset.key = key;
  if (node.closed) group.classList.add("closed");
  group.appendChild(buildRow(node));
  let count = 1;

  if (node.children.length){
    const kids = el("div", "kids");
    kids.id = "kids-" + key;
    kids.hidden = true;
    node.children.forEach(function(childKey){
      const child = NODES[childKey];
      kids.appendChild(buildRow(child));
      count++;
      // Стадии выводятся сразу под своей стори, без отдельного раскрытия:
      // разрыв между дизайном и разработкой виден, только когда обе полосы
      // на экране одновременно.
      (child.children || []).forEach(function(stageKey){
        kids.appendChild(buildRow(NODES[stageKey]));
        count++;
      });
    });
    group.appendChild(kids);
  }
  return { group: group, count: count };
}

/** Сворачиваемая секция. Строки без дат прячутся за ней по умолчанию:
 *  на таймлайне от них пользы нет, но как список «что не запланировано»
 *  они нужны — поэтому не удаляем, а убираем с глаз. */
function buildSection(title, keys, expanded){
  const wrap = el("div", "section-wrap");
  const btn = el("button", "section", title + " — " + keys.length);
  btn.type = "button";
  btn.setAttribute("aria-expanded", String(expanded));

  const box = el("div", "kids");
  box.id = "sect-" + title.replace(/\s+/g, "-");
  box.hidden = !expanded;
  btn.setAttribute("aria-controls", box.id);

  let count = 0;
  keys.forEach(function(key){
    const built = buildGroup(key);
    box.appendChild(built.group);
    count += built.count;
  });

  wrap.appendChild(btn);
  wrap.appendChild(box);
  return { wrap: wrap, count: count };
}

function renderRows(){
  const body = document.getElementById("body");
  let rendered = 0;

  const dated = DATA.roots.filter(function(k){ return NODES[k].bar || NODES[k].point; });
  const undated = DATA.roots.filter(function(k){ return !NODES[k].bar && !NODES[k].point; });

  dated.forEach(function(key){
    const built = buildGroup(key);
    body.appendChild(built.group);
    rendered += built.count;
  });

  if (DATA.orphanGroup.length){
    const sect = buildSection("Без эпика", DATA.orphanGroup, true);
    body.appendChild(sect.wrap);
    rendered += sect.count;
  }

  if (undated.length){
    const sect = buildSection("Без дат", undated, false);
    body.appendChild(sect.wrap);
    rendered += sect.count;
  }

  if (!rendered) body.appendChild(el("div", "empty-note", "Нет данных для отображения"));
  return rendered;
}

/* ── Раскрытие ──────────────────────────────────────── */
document.getElementById("body").addEventListener("click", function(e){
  const btn = e.target.closest(".twisty, .section");
  if (!btn) return;
  const box = document.getElementById(btn.getAttribute("aria-controls"));
  if (!box) return;
  const open = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!open));
  box.hidden = open;
});

document.getElementById("expand-all").addEventListener("click", function(){
  const anyClosed = [...document.querySelectorAll(".twisty, .section")]
    .some(function(b){ return b.getAttribute("aria-expanded") === "false"; });
  document.querySelectorAll(".twisty, .section").forEach(function(b){
    b.setAttribute("aria-expanded", String(anyClosed));
    const box = document.getElementById(b.getAttribute("aria-controls"));
    if (box) box.hidden = !anyClosed;
  });
  this.textContent = anyClosed ? "Свернуть всё" : "Развернуть всё";
});

document.getElementById("toggle-done").addEventListener("change", function(e){
  document.body.classList.toggle("hide-done", e.target.checked);
});

/* Стартовое состояние берём из самого чекбокса, а не хардкодом: галочка
   стоит в разметке, и без этой синхронизации класса на body не будет —
   фильтр включится только после первого клика. */
document.body.classList.toggle("hide-done",
  document.getElementById("toggle-done").checked);

/* ── Поиск ──────────────────────────────────────────── */

/** Ключи предков строки — по цепочке parent до корня.
 *
 *  Родитель берётся из данных, а не из разметки: Гант кладёт стадию плоско
 *  внутрь группы эпика, сразу под своей стори, и по DOM её стори не отличить
 *  от соседней. Защита от цикла нужна — в очереди встречаются карточки,
 *  замкнутые сами на себя через цепочку родителей. */
function ancestorsOf(key, nodes){
  const path = [];
  const seen = {};
  let current = nodes[key] ? nodes[key].parent : null;
  while (current && nodes[current] && !seen[current]){
    seen[current] = true;
    path.push(current);
    current = nodes[current].parent;
  }
  return path;
}

/** Поиск по Ганту: совпадения помечаем `match`, их предков — `on-path`.
 *  Предок, который совпал сам, остаётся `match` — иначе строка теряла бы
 *  признак совпадения из-за того, что под ней нашлось что-то ещё. */
function filterGantt(query){
  const gantt = document.getElementById("gantt");
  const rows = gantt.querySelectorAll(".row");
  document.body.classList.toggle("filtering", query.length > 0);
  rows.forEach(function(row){ row.classList.remove("match", "on-path"); });
  clearMarks(gantt);
  if (!query) return;

  const path = {};
  rows.forEach(function(row){
    if (row.dataset.search.indexOf(query) === -1) return;
    row.classList.add("match");
    highlightRow(row, query);
    ancestorsOf(row.dataset.key, NODES).forEach(function(key){ path[key] = true; });
  });
  rows.forEach(function(row){
    if (path[row.dataset.key] && !row.classList.contains("match")) row.classList.add("on-path");
  });
}

document.getElementById("search").addEventListener("input", function(){
  const query = searchQuery();
  filterGantt(query);
  applyTreeFilter();
});

/* ── Масштаб ────────────────────────────────────────── */
function setScale(next){
  if (next === scale) return;

  // Запоминаем дату в центре экрана и возвращаемся к ней после смены:
  // без этого каждое переключение выбрасывает в другой месяц.
  const nameW = parseFloat(getComputedStyle(root).getPropertyValue("--name-w"));
  const centerDay = (gantt.scrollLeft - nameW + gantt.clientWidth / 2) / dayPx();

  scale = next;
  root.style.setProperty("--day-px", SCALES[scale] + "px");
  root.setAttribute("data-scale", scale);
  renderScale();

  gantt.scrollLeft = Math.max(0, centerDay * dayPx() + nameW - gantt.clientWidth / 2);
}

/** Прокрутка к сегодняшнему дню. Шкала тянется от февраля до ноября, и
 *  после поиска или смены масштаба вернуться к «сейчас» иначе нечем.
 *  Тем же расчётом открывается страница — чтобы кнопка возвращала ровно
 *  туда, где Гант был при загрузке, а не примерно рядом. */
function scrollToToday(smooth){
  if (TODAY < TL.from || TODAY > TL.to) return;

  // Колонка имён занимает левые --name-w и не прокручивается: день ноль
  // таймлайна лежит не в нуле прокрутки, а за ней. Центрируем по видимой
  // части трека, иначе «сегодня» уезжает за правый край — так и было.
  const nameW = parseFloat(getComputedStyle(root).getPropertyValue("--name-w")) || 0;
  const target = Math.max(0,
    nameW + (TODAY - TL.from) * dayPx() - (gantt.clientWidth + nameW) / 2);

  // Своя анимация вместо `behavior:"smooth"`: нативная плавность молча не
  // срабатывает в части окружений — прокрутка просто не происходит, и кнопка
  // выглядит сломанной. Поймано на этом же прототипе.
  // Скрытая вкладка кадры не выдаёт: анимация не начнётся вовсе, и кнопка
  // будет выглядеть мёртвой. Там прыгаем сразу — увидят уже результат.
  if (smooth === false || document.hidden
      || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    gantt.scrollLeft = target;
    return;
  }

  const start = gantt.scrollLeft;
  const delta = target - start;
  if (!delta) return;
  const began = performance.now();

  function step(now){
    const t = Math.min(1, (now - began) / 260);
    gantt.scrollLeft = start + delta * (1 - Math.pow(1 - t, 3));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

scaleDropdown = createDropdown({
  items: SCALE_ITEMS,
  value: scale,
  placeholder: "Масштаб",
  onChange: setScale,
});
document.getElementById("scale-slot").appendChild(scaleDropdown.el);

/* ── Тема ───────────────────────────────────────────── */
const themeBtn = document.getElementById("theme");
function setTheme(dark){
  root.setAttribute("data-theme", dark ? "dark" : "light");
  themeBtn.textContent = dark ? "Светлая" : "Тёмная";
  try { localStorage.setItem("gantt-theme", dark ? "dark" : "light"); } catch (err) { /* file:// */ }
}
themeBtn.addEventListener("click", function(){
  setTheme(root.getAttribute("data-theme") !== "dark");
});
try { setTheme(localStorage.getItem("gantt-theme") === "dark"); } catch (err) { setTheme(false); }

/* ── Тултип ─────────────────────────────────────────── */
let pinnedKey = null;

/** План разошёлся с фактом. Только для таких строк подсказка
 *  разворачивается в разбор — на совпавших она была бы шумом. */
function mismatch(node){
  return !!(node.fact && node.bar && !node.flags.includes("plan-missing")
    && (node.fact.from !== node.bar.from || node.fact.to !== node.bar.to));
}

function showTip(target, x, y){
  const row = target.closest(".row");
  const node = row && NODES[row.dataset.key];
  if (!node) return;

  tip.textContent = "";
  tip.appendChild(el("b", null, node.key + " · " + node.summary));

  const dl = document.createElement("dl");
  function add(term, value){
    if (!value) return;
    dl.appendChild(el("dt", null, term));
    dl.appendChild(el("dd", null, value));
  }
  add("Тип", node.type);
  add("Статус", node.status);
  add("Приоритет", node.priority);
  add("Исполнитель", node.assignee);
  add("Спринт", node.sprint);
  // Полоса — всегда план. Разбор добавляется там, где факт с ним разошёлся.
  const detail = mismatch(node);

  if (node.bar && node.flags.includes("plan-missing")){
    add("Срок", "на карточке не задан");
    add("Работали", dayToText(node.fact.from) + " → " + dayToText(node.fact.to));
  } else if (node.bar){
    add("План по карточке", dayToText(node.bar.from) + " → " + dayToText(node.bar.to)
      + (node.bar.to < TODAY && !node.closed ? "  (просрочено)" : ""));
    if (node.fact){
      add("Работали", dayToText(node.fact.from) + " → " + dayToText(node.fact.to));
    }
    if (detail){
      const dl = node.fact.from - node.bar.from, dr = node.fact.to - node.bar.to;
      const parts = [];
      if (dl < 0) parts.push("начали на " + (-dl) + " дн. раньше плана");
      if (dl > 0) parts.push("начали на " + dl + " дн. позже плана");
      if (dr > 0) parts.push("вышли за дедлайн на " + dr + " дн.");
      /* На эпике запас плана — норма: контейнер запланирован шире, чем уже
         заведённые работы. Сигнал оставлен стори и стадиям. */
      if (dr < 0 && node.level !== 0) parts.push("план тянется на " + (-dr) + " дн. дольше работ");
      if (parts.length) add("Расхождение", parts.join("; "));
    }
  } else if (node.point){
    add(node.point.kind === "deadline" ? "Дедлайн" : "Начало", dayToText(node.point.day));
    add("Внимание", node.point.kind === "deadline"
      ? "начало не задано — длительность неизвестна"
      : "дедлайн не задан — длительность неизвестна");
  } else {
    add("Срок", "даты не заданы");
  }
  tip.appendChild(dl);

  // Состав размаха. Отвечает на вопрос «почему полоса такая» прямо в месте,
  // где он возникает, — и даёт уйти в карточку, чтобы поправить сроки.
  // Виновник показывается только у той границы, которая реально вылезла за
  // план, и только один. Если работа начинается вовремя, список карточек с
  // пометкой «начало» ничего не объясняет — их может быть и четыре сразу.
  const edges = [];
  if (detail){
    const kids = node.spanKids || [];
    if (node.fact.from < node.bar.from){
      const k = kids.find(function(x){ return x.edge && x.edge.indexOf("start") === 0; });
      if (k) edges.push(k);
    }
    if (node.fact.to > node.bar.to){
      const k = kids.find(function(x){ return x.edge && x.edge.indexOf("end") >= 0; });
      if (k && edges.indexOf(k) === -1) edges.push(k);
    }
  }

  if (edges.length){
    tip.appendChild(el("b", "tip-sub", edges.length > 1 ? "Выходят за план" : "Выходит за план"));
    const list = el("div", "tip-kids");
    edges.forEach(function(kid){
      const line = el("div", "tip-kid");
      const link = el("a", "key", kid.key);
      link.href = "https://tracker.yandex.ru/" + kid.key;
      link.target = "_blank";
      link.rel = "noopener";
      line.appendChild(link);
      line.appendChild(el("span", "tip-kid-type", kid.type));
      line.appendChild(el("span", "tip-kid-dates",
        (kid.start ? dayToText(kid.from) : "—") + " → " + (kid.deadline ? dayToText(kid.to) : "—")));
      line.appendChild(el("span", "tip-edge",
        kid.from < node.bar.from && kid.to > node.bar.to ? "с обеих сторон"
        : kid.from < node.bar.from ? "раньше плана" : "позже плана"));
      line.appendChild(el("span", "tip-kid-name", kid.summary));
      list.appendChild(line);
    });
    tip.appendChild(list);

    // Через двоеточие: числительное в косвенном падеже ломается на каждом
    // пересчёте, и «1 карточек» уже ловили в футере.
    const rest = node.spanKidsTotal - edges.length;
    if (rest > 0) tip.appendChild(el("div", "tip-more", "внутри ещё карточек: " + rest));

    tip.appendChild(el("div", "tip-hint",
      pinnedKey === node.key ? "Esc или клик вне — закрыть" : "Клик — закрепить и перейти в карточку"));
  }

  placeTip(target, x, y);
}

/** Показывает уже заполненный #tip: у курсора, а без координат — у самого
 *  элемента (так подсказку открывает фокус с клавиатуры).
 *
 *  Вынесено из showTip, потому что подсказку показывает ещё и берндаун на
 *  «Спринтах». Содержимое у них разное и общего кода там быть не может, а
 *  вот прижатие к краям окна и переворот вверх, когда снизу не помещается, —
 *  ровно одни и те же. Вторая копия этой арифметики разъехалась бы с первой
 *  при первой же правке отступов. */
function placeTip(target, x, y){
  const rect = target.getBoundingClientRect();
  const anchorX = x == null ? rect.left : x + 16;
  const anchorY = y == null ? rect.bottom + 6 : y + 18;

  tip.style.display = "block";
  tip.style.left = Math.max(8, Math.min(anchorX, window.innerWidth - tip.offsetWidth - 12)) + "px";
  tip.style.top = (anchorY + tip.offsetHeight + 12 > window.innerHeight
    ? Math.max(8, anchorY - tip.offsetHeight - 26)
    : anchorY) + "px";
}

/* Тултип только на полосе, ромбе и названии — не на всей ширине строки.
   Иначе он выскакивает от любого движения мыши над пустым треком.
   Ромб обязателен: без пояснения он читается как загадочный значок. */
const TIP_TARGETS = ".bar-fact, .point, .title, .pill";

/** Закреплённая подсказка. Без неё до ссылок внутри не дотянуться: уводя
 *  мышь к карточке, пересекаешь пустой трек, и подсказка гаснет. */
function unpin(){
  pinnedKey = null;
  tip.classList.remove("pinned");
  tip.style.display = "none";
}

gantt.addEventListener("mousemove", function(e){
  if (pinnedKey) return;
  const target = e.target.closest(TIP_TARGETS);
  if (target) showTip(target, e.clientX, e.clientY);
  else tip.style.display = "none";
});
gantt.addEventListener("mouseleave", function(){ if (!pinnedKey) tip.style.display = "none"; });

gantt.addEventListener("click", function(e){
  if (e.target.closest("a")) return;
  // Закрепляет контур расхождения — он же единственный даёт разбор.
  const target = e.target.closest(".bar-fact");
  if (!target) return;
  const row = target.closest(".row");
  const node = row && NODES[row.dataset.key];
  if (!node || !mismatch(node)) return;
  pinnedKey = node.key;
  tip.classList.add("pinned");
  showTip(target, e.clientX, e.clientY);
});

document.addEventListener("click", function(e){
  if (!pinnedKey) return;
  if (e.target.closest("#tip") || e.target.closest(".bar-fact")) return;
  unpin();
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && pinnedKey) unpin(); });

gantt.addEventListener("focusin", function(e){
  if (pinnedKey) return;
  const row = e.target.closest(".row");
  const title = row && row.querySelector(".title");
  if (title) showTip(title);
});
gantt.addEventListener("focusout", function(){ if (!pinnedKey) tip.style.display = "none"; });
gantt.addEventListener("scroll", function(){ if (!pinnedKey) tip.style.display = "none"; }, { passive: true });

/* Тот же приём для «Спринтов»: подсказку берндауна показывает уже другой
   код, но гасить её на прокрутке нужно так же — она позиционируется от
   экрана и после скролла указывала бы в пустоту. Регистрируется здесь, а
   не в renderBurndown: контейнер вкладки живёт всё время, и обработчик ему
   нужен ровно один.
   Guard по pinnedKey тут не нужен и был бы вреден: закрепление вешает
   только Гант и только на своих полосах, на «Спринтах» закреплённой
   подсказки не бывает. С guard'ом подсказка берндауна залипала бы на
   экране, если pinnedKey остался от прошлой вкладки. */
document.getElementById("sprints").addEventListener("scroll",
  function(){ tip.style.display = "none"; }, { passive: true });

/* ── Вид «Проблемы» ─────────────────────────────────── */

/** Просрочка зависит от «сегодня», поэтому считается здесь, а не на сборке:
 *  файл лежит на диске неделями и вшитый список успел бы устареть. */
function overdueGroup(){
  const keys = Object.keys(NODES).filter(function(k){
    const n = NODES[k];
    return n.bar && !n.closed && n.bar.to < TODAY;
  }).sort(function(a, b){ return NODES[a].bar.to - NODES[b].bar.to; });

  if (!keys.length) return null;
  return {
    id: "overdue",
    title: "Просрочено",
    hint: "Дедлайн прошёл, задача не закрыта — сдвинуть дату или закрыть",
    keys: keys,
    urgent: true,
  };
}

/** Блок «что изменилось с прошлой сборки». Считается в build.py, потому что
 *  сравнивать можно только два прогона, а страница знает лишь про текущий. */
function renderDiff(){
  const diff = META.diff;
  if (!diff || (!diff.resolved.length && !diff.added.length)) return;

  const box = el("div", "diff");
  const head = el("b", null, "Изменения: было " + diff.before + ", стало " + diff.after);
  box.appendChild(head);
  box.appendChild(el("span", "since", "  · с " + diff.since.slice(8,10) + "." +
    diff.since.slice(5,7) + " " + diff.since.slice(11,16)));

  const list = document.createElement("ul");
  diff.resolved.forEach(function(row){
